ent default. The Executive Summit in June 2026 is the next public proof point — and it is not the last.<\u002Fp>\n    <div class=\"fwd-stats\">\n      <div class=\"fstat\"><div class=\"n\">2,000+<\u002Fdiv><div class=\"l\">Agent Network Goal<\u002Fdiv><\u002Fdiv>\n      <div class=\"fstat\"><div class=\"n\">$719M<\u002Fdiv><div class=\"l\">2026 Revenue Target<\u002Fdiv><\u002Fdiv>\n      <div class=\"fstat\"><div class=\"n\">8.1%<\u002Fdiv><div class=\"l\">Resale Market Share Target<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section-tag\" style=\"margin-bottom:20px;\">Get in Touch<\u002Fdiv>\n  <div class=\"contact-block\">\n    <div class=\"contact-av\" style=\"background:rgba(232,147,74,.1);color:var(--gold);\">AT<\u002Fdiv>\n    <div class=\"contact-info\">\n      <h4>ATS Team<\u002Fh4>\n      <div class=\"c-title\" style=\"color:var(--gold);\">AI Technology and Solutions · General Inquiries<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--gray);line-height:1.6;margin-top:8px;max-width:520px;\">For consultations, product questions, partnership conversations, or anything related to what's in this playbook — we read every email.<\u002Fdiv>\n      <div class=\"contact-tags\" style=\"margin-top:12px;\">\n        <span class=\"ctag\">AI Consultations<\u002Fspan><span class=\"ctag\">Product Questions<\u002Fspan><span class=\"ctag\">Innovation Requests<\u002Fspan><span class=\"ctag\">Intelligence Briefs<\u002Fspan><span class=\"ctag\">FieldIQ<\u002Fspan><span class=\"ctag\">Executive Summit<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"contact-right\">\n      <a href=\"mailto:ATSteam@wfgtitle.com\">ATSteam@wfgtitle.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DISCOVERY BOT — Live Capability Showcase -->\n  <div class=\"section-tag\" style=\"margin:36px 0 12px;\">Bonus · A Live Look at the Architecture<\u002Fdiv>\n  <p style=\"font-size:13px;color:var(--gray);line-height:1.7;max-width:720px;margin-bottom:20px;\">Before you go — here's one product running in production today that shows the multi-agent architecture in action. It's how ATS stays close to the work.<\u002Fp>\n  <div class=\"discovery-bot-card\">\n    <div class=\"db-header\">\n      <div class=\"db-icon\" aria-hidden=\"true\">\n        <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:var(--teal);\"><rect x=\"4\" y=\"6\" width=\"16\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M12 2v4\"><\u002Fpath><circle cx=\"9\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"1\"><\u002Fcircle><path d=\"M9 16h6\"><\u002Fpath><path d=\"M2 12h2M20 12h2\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"db-title-block\">\n        <h4>Discovery Bot — AI-Powered Employee Insights<\u002Fh4>\n        <div class=\"db-sub\">Multi-Agent Architecture · Internal Intelligence System<\u002Fdiv>\n        <div style=\"margin-top:8px;\"><span class=\"live-badge\"><span class=\"live-dot\"><\u002Fspan>Live Capability<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13.5px;color:var(--gray);line-height:1.8;max-width:760px;\">Traditional feedback channels miss the real problems — the friction that never makes it into a ticket, the workaround that everyone uses but nobody documents. The Discovery Bot was built to change that. It is ATS building internally first: a proof that multi-agent AI architecture delivers measurable value inside WFG before it scales outward.<\u002Fp>\n    <div class=\"db-grid\">\n      <div class=\"db-item\">\n        <div class=\"db-item-label\">What It Is<\u002Fdiv>\n        <p>An always-on AI system that reaches employees through SMS and Slack. A conversational agent named Alex engages weekly, asking about real operational pain points in a low-friction, high-trust format designed to surface what people actually experience — not just what they report.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"db-item\">\n        <div class=\"db-item-label\">How It Works<\u002Fdiv>\n        <p>Alex captures six structured signals per interaction: the problem, the workaround being used, how often it occurs, its operational impact, what the ideal outcome would be, and the time cost per week. A second AI agent processes that input and converts it into a structured insight report shared directly with ATS.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"db-item\">\n        <div class=\"db-item-label\">Why It Exists<\u002Fdiv>\n        <p>The most expensive problems in any organization are the ones that never get reported. The Discovery Bot creates a direct, structured channel between the field and the build team — so ATS is always solving real problems, not assumed ones.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"db-item\">\n        <div class=\"db-item-label\">Why It Matters<\u002Fdiv>\n        <p>This is ATS's multi-agent architecture running in production. Two AI agents — one conversational, one analytical — working in sequence to convert unstructured human feedback into actionable intelligence. It is not a pilot. It is how ATS stays connected to the ground truth of how WFG operates.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"closing-strip\">\n    <p>At WFG, everything we do is <strong style=\"color:var(--white);\">because of you.<\u002Fstrong> ATS exists to make that real through every workflow, every tool, and every piece of intelligence we put in the hands of the people who serve our customers. <em>Patrick Stone<\u002Fem><\u002Fp>\n    <div class=\"motto\">IDEAS THAT IGNITE<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"page-num\">10<\u002Fdiv>\n<\u002Fdiv>\n\n<footer>\n  <div class=\"f-left\">\n    WFG National Title Insurance Company · AI Technology and Solutions<br>\n    <span style=\"opacity:.45;\">Strategy Playbook 2026 · Confidential · For Internal Leadership Distribution<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"f-right\">WFG · ATS · IDEAS THAT IGNITE<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv><!-- /main-content -->\n\n<script>\nconst spokeData = [\n  {\n    title: \"eRemit — Remittance Automation\",\n    body: \"Title agent remittance payment platform built with Verndale. Enables agents to pay remittances directly from the platform with intelligent filtering, policy-level tracking, and AMS integration. Removes reconciliation friction and reporting overhead for every agency in the network.\"\n  },\n  {\n    title: \"Agent Application Tracking Portal (AATP)\",\n    body: \"Internal platform increasing visibility, accessibility, and transparency across Sales Reps, Managers, and Agency Support for all in-progress agent applications. Phase 1 deployed; Phase 2 in active development — expanding NPI document handling and lifecycle management.\"\n  },\n  {\n    title: \"ATS Intelligence Briefs\",\n    body: \"Short AI education video series led by Priyal Katudia — four issues published, fraud-awareness focused, and reaching the full agent network. Each brief surfaces a practical AI tool and closes with a fraud prevention tip. WFG's primary external knowledge channel for agents.\"\n  },\n  {\n    title: \"MyHomePrompts Advisor WFG — Brand Voice and Content Platform\",\n    body: \"AI-powered brand voice and content platform for agents and realtors, rebranded from MyHomePrompts Advisor WFG under Wendy Lunt's direction. MVP in active development with the Alltegrio team — single persistent brand voice per user, role-based onboarding, AI-driven content generation. Launching at the WFG Executive Summit, June 2026.\"\n  },\n  {\n    title: \"Deadline Calculator — Transaction Intelligence\",\n    body: \"Automates 16+ critical contract date computations with full federal holiday handling. Supports both cash and financed deals. Removes guesswork from contract management for agency-side and realtor-side users alike.\"\n  },\n  {\n    title: \"Fraud Detection — Risk Intelligence\",\n    body: \"Deep data analysis of WFG fraud claims led by Vedant Upganlawar in partnership with Alan Fields, WFG Lead Underwriter. Identifies patterns in historical records to build proactive detection and prevention tools across Agency and Direct channels. Phase 1 analysis completed.\"\n  }\n];\n\nconst spokeEventNames = [\n  \"spoke_eremit_clicked\",\n  \"spoke_aatp_clicked\",\n  \"spoke_intelligence_brief_clicked\",\n  \"spoke_myhome_clicked\",\n  \"spoke_deadline_calc_clicked\",\n  \"spoke_fraud_ai_clicked\"\n];\n\nfunction showSpoke(i) {\n  document.getElementById('eco-detail-title').textContent = spokeData[i].title;\n  document.getElementById('eco-detail-body').textContent = spokeData[i].body;\n  if (spokeEventNames[i]) trackEvent(spokeEventNames[i]);\n}\n<\u002Fscript>\n\n<script>\nfunction trackEvent(name) {\n  if (typeof clarity === \"function\") {\n    clarity(\"event\", name);\n  }\n}\n\nfunction showMain(id) {\n  document.getElementById('main-content').style.display = 'block';\n  document.getElementById('briefs-content').style.display = 'none';\n  document.getElementById('catalogue-content').style.display = 'none';\n  history.replaceState(null, '', window.location.pathname);\n  const el = document.getElementById(id);\n  if (el) setTimeout(() => el.scrollIntoView({behavior:'smooth',block:'start'}), 80);\n}\n\nfunction showBriefs(view, updateHash) {\n  document.getElementById('main-content').style.display = 'none';\n  document.getElementById('briefs-content').style.display = 'block';\n  document.getElementById('catalogue-content').style.display = 'none';\n  document.querySelectorAll('.briefs-section').forEach(s => s.classList.remove('active'));\n  const map = {intro:'briefs-intro',v1:'briefs-v1',v2:'briefs-v2',v3:'briefs-v3',v4:'briefs-v4'};\n  const t = document.getElementById(map[view]);\n  if (t) { t.classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }\n  if (updateHash !== false) history.replaceState(null, '', '#briefs-' + view);\n  const briefEventMap = {v1:'brief_v1_clicked',v2:'brief_v2_clicked',v3:'brief_v3_clicked',v4:'brief_v4_clicked'};\n  if (briefEventMap[view]) trackEvent(briefEventMap[view]);\n}\n\nfunction showCatalogue() {\n  document.getElementById('main-content').style.display = 'none';\n  document.getElementById('briefs-content').style.display = 'none';\n  document.getElementById('catalogue-content').style.display = 'block';\n  window.scrollTo({top:0,behavior:'smooth'});\n  history.replaceState(null, '', '#catalogue');\n}\n\n// Handle deep links on page load\nwindow.addEventListener('load', function() {\n  const hash = window.location.hash;\n  const match = hash.match(/^#briefs-(intro|v1|v2|v3|v4)$/);\n  if (match) showBriefs(match[1], false);\n  if (hash === '#catalogue') showCatalogue();\n});\n<\u002Fscript>\n\n<!-- ══════════════════════════════════════════\n     ATS INTELLIGENCE BRIEFS\n══════════════════════════════════════════ -->\n<div id=\"briefs-content\" style=\"display:none;\">\n\n<!-- ── INTRO ── -->\n<div id=\"briefs-intro\" class=\"briefs-section active\">\n<div class=\"briefs-intro-page\">\n  <div class=\"briefs-series-label\">ATS · WFG National Title · Internal Series<\u002Fdiv>\n  <h1 class=\"briefs-intro-title\">ATS <span class=\"acc\">Intelligent<\u002Fspan><br>Briefs<\u002Fh1>\n  <p class=\"briefs-intro-sub\">A running series from the ATS team designed to spotlight practical tools, useful ideas, and real-world risk patterns worth paying attention to. The goal is not to surface every trend. It's to find the few things that are genuinely useful, explain why they matter, and make them easy to explore.<\u002Fp>\n  <div class=\"briefs-intro-divider\"><\u002Fdiv>\n  <div class=\"briefs-meta-strip\">\n    <div class=\"briefs-meta-item\"><div class=\"briefs-meta-label\">Published By<\u002Fdiv><div class=\"briefs-meta-val\">ATS — AI, Technology &amp; Solutions<\u002Fdiv><\u002Fdiv>\n    <div class=\"briefs-meta-item\"><div class=\"briefs-meta-label\">Cadence<\u002Fdiv><div class=\"briefs-meta-val\">Bi-weekly, ongoing<\u002Fdiv><\u002Fdiv>\n    <div class=\"briefs-meta-item\"><div class=\"briefs-meta-label\">Audience<\u002Fdiv><div class=\"briefs-meta-val\">Title ops, agents, field enablement<\u002Fdiv><\u002Fdiv>\n    <div class=\"briefs-meta-item\"><div class=\"briefs-meta-label\">Distribution<\u002Fdiv><div class=\"briefs-meta-val\">Internal · WFG Agency Network<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"quote-block\" style=\"margin-bottom:48px;\">\n    <p>Each issue covers two or three tools the ATS team has spent time with, a fraud or risk pattern worth understanding in operational detail, and a short note on where things connect to the broader WFG picture. They're meant to be quick to get through and actually useful once you do.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card-grid\" style=\"margin-bottom:40px;\">\n    <div class=\"card\"><div class=\"card-icon\">🛠<\u002Fdiv><h3>Practical AI Tools<\u002Fh3><p>Each issue surfaces tools relevant to title operations — explained with enough context to understand whether they're worth exploring, not just catalogued for completeness.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-icon\">⚠️<\u002Fdiv><h3>Fraud Awareness<\u002Fh3><p>One fraud or risk pattern per issue, covered in enough operational detail to be useful in training conversations — not just a bullet-point reminder to \"be careful.\"<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-icon\">📡<\u002Fdiv><h3>ATS Perspective<\u002Fh3><p>Where relevant, the team adds context on how a tool or risk pattern connects to WFG's operating model, field initiatives, or ongoing technology work.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"briefs-issues-label\">Current Issues<\u002Fdiv>\n  <div class=\"briefs-issues-grid\">\n    <a class=\"brief-issue-card\" onclick=\"showBriefs('v1');return false;\" href=\"#\">\n      <div class=\"bic-num\">Issue 01 · Feb 2026<\u002Fdiv>\n      <div class=\"bic-title\">DocAnalyzer, Alanna &amp; Wire Fraud Basics<\u002Fdiv>\n      <div class=\"bic-tools\">DocAnalyzer.ai · Alanna.ai · Cyber411.ai<\u002Fdiv>\n      <div class=\"bic-arrow\">Read Issue →<\u002Fdiv>\n      <div><span class=\"bic-badge fraud\">Fraud: Patient Attack + Display Name Trick<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <a class=\"brief-issue-card\" onclick=\"showBriefs('v2');return false;\" href=\"#\">\n      <div class=\"bic-num\">Issue 02 · Feb 2026<\u002Fdiv>\n      <div class=\"bic-title\">Rhino AI, HouseWhisper &amp; the AI-Powered Strike<\u002Fdiv>\n      <div class=\"bic-tools\">Rhino AI · HouseWhisper AI<\u002Fdiv>\n      <div class=\"bic-arrow\">Read Issue →<\u002Fdiv>\n      <div><span class=\"bic-badge fraud\">Fraud: AI-Assisted Wire Attack Sequence<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <a class=\"brief-issue-card\" onclick=\"showBriefs('v3');return false;\" href=\"#\">\n      <div class=\"bic-num\">Issue 03 · Mar 2026<\u002Fdiv>\n      <div class=\"bic-title\">Orbital, PalmAgent &amp; Seller Impersonation<\u002Fdiv>\n      <div class=\"bic-tools\">Orbital · PalmAgent<\u002Fdiv>\n      <div class=\"bic-arrow\">Read Issue →<\u002Fdiv>\n      <div><span class=\"bic-badge fraud\">Fraud: POA Fraud + Identity Fabrication<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <a class=\"brief-issue-card\" onclick=\"showBriefs('v4');return false;\" href=\"#\">\n      <div class=\"bic-num\">Issue 04 · Mar 2026<\u002Fdiv>\n      <div class=\"bic-title\">Mapify, Perplexity &amp; Fake Payoff Statements<\u002Fdiv>\n      <div class=\"bic-tools\">Mapify.ai · Perplexity AI<\u002Fdiv>\n      <div class=\"bic-arrow\">Read Issue →<\u002Fdiv>\n      <div><span class=\"bic-badge fraud\">Fraud: Counterfeit Payoff Documents<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n  <div class=\"bridge\">\n    <h3>How to Use This Series<\u002Fh3>\n    <p>Each issue stands on its own — open any version and read it in full, or jump directly to the fraud section if that's what you need. The tool sections are written to be skimmable but detailed enough to be actionable. If something in a brief connects to work you're doing or a situation your team has encountered, the ATS team is the right point of contact. Reach out at ATSTeam@wfgtitle.com.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── BRIEF V1 ── -->\n<div id=\"briefs-v1\" class=\"briefs-section\">\n<div class=\"brief-page\">\n  <div class=\"brief-back-nav\">\n    <button class=\"brief-back-btn\" onclick=\"showBriefs('intro')\">← All Briefs<\u002Fbutton>\n    <div class=\"brief-nav-arrows\">\n      <button class=\"brief-nav-btn\" disabled=\"\">← Prev<\u002Fbutton>\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v2')\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"brief-issue-tag\">Issue 01 · Volume 1 · February 6, 2026<\u002Fdiv>\n  <h1 class=\"brief-title\">DocAnalyzer, Alanna<br><span class=\"acc\">&amp; Two Wire Fraud Patterns<\u002Fspan><\u002Fh1>\n  <p class=\"brief-intro\">The first issue. Two tools worth knowing about, and two fraud scenarios that come up often enough in title operations that every team should be comfortable discussing them out loud. The tools are on opposite ends of the complexity spectrum — one is free and instant to try, the other is enterprise-grade. Both are useful.<\u002Fp>\n\n  <!-- TOOL 1 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 01 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 01<\u002Fdiv>\n          <div class=\"btc-name\">DocAnalyzer.ai<\u002Fdiv>\n          <div class=\"btc-url\">docanalyzer.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Document Intelligence<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">The concept is simple: upload a document and ask it questions. A 60-page title commitment, an SOP, a state regulation — whatever you'd normally have to search through manually. Answers come back in seconds, grounded only in what you uploaded, not the open internet.<\u002Fp>\n        <p class=\"btc-prose\">The practical payoff for examiners is real. Finding a specific clause in a long document typically takes 20 minutes or more. With DocAnalyzer, it takes under a minute. <strong>The general estimate is 5–7 hours saved per week per examiner<\u002Fstrong> — time that can go back to actual underwriting judgment rather than document navigation.<\u002Fp>\n        <div class=\"btc-highlight\"><p>New team members can answer their own questions from uploaded reference materials rather than pulling a senior examiner out of their work every time. It doesn't replace mentorship, but it handles the routine lookups so the senior conversations can be the important ones.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Underwriting<\u002Fspan>\n          <span class=\"btc-tag\">Training &amp; CE<\u002Fspan>\n          <span class=\"btc-tag\">Document Review<\u002Fspan>\n          <span class=\"btc-tag\">Compliance Lookup<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — DocAnalyzer.ai<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Walkthrough: uploading a title commitment and querying specific clauses<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.25%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAG_jxnSk4Q/shXlBvTViXvPY5tCMJr8ew/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAG_jxnSk4Q/shXlBvTViXvPY5tCMJr8ew/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v1_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/@docAnalyzer_ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_docanalyzer_youtube_clicked')\">↗ YouTube Channel<\u002Fa>\n            <a href=\"https://docanalyzer.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_docanalyzer_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://docanalyzer.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_docanalyzer_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">DocAnalyzer.ai<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Overview<\u002Fspan><span class=\"ref-link-label\">Product Page<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_tools_overview_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Tools Overview<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_doc_review_process_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Document Review Process<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/@docAnalyzer_ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_docanalyzer_youtube_clicked')\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">DocAnalyzer YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">AI for Document Review<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TOOL 2 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 02 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 02<\u002Fdiv>\n          <div class=\"btc-name\">Alanna.ai<\u002Fdiv>\n          <div class=\"btc-url\">alanna.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Title Operations AI<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">Alanna is built specifically for title companies. It connects into your internal systems and handles inbound client communication — answering order status questions, providing updates, and generating net sheets — around the clock, without staff involvement for the routine inquiries.<\u002Fp>\n        <p class=\"btc-prose\"><strong>Processors at most title shops spend 10 to 15 hours a week on repetitive status questions. That's $12K to $18K per year per person in labor going toward tasks that don't require human judgment.<\u002Fstrong> For a team of five, the opportunity cost runs $60K to $90K annually.<\u002Fp>\n        <div class=\"btc-highlight\"><p>Worth being honest about the scope: this is an enterprise product designed for offices handling 150 or more orders per month. It's not a tool for smaller shops. But for high-volume operations, it directly addresses one of the most persistent drains on processor capacity.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Title Operations<\u002Fspan>\n          <span class=\"btc-tag\">Client Communication<\u002Fspan>\n          <span class=\"btc-tag\">High-Volume Offices<\u002Fspan>\n          <span class=\"btc-tag\">Enterprise<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — Alanna.ai<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Product overview: client Q&amp;A automation and net sheet generation<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.25%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAG_kJlzyZY/1PCQVxSIKQUwWzoysVXtuA/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAG_kJlzyZY/1PCQVxSIKQUwWzoysVXtuA/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v1_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/watch?v=7w4tZPp3Wqk\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_alanna_youtube_clicked')\">↗ Product Demo (YouTube)<\u002Fa>\n            <a href=\"https://www.alanna.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_alanna_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://www.alanna.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_alanna_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Alanna.ai<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/watch?v=7w4tZPp3Wqk\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_alanna_youtube_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Demo<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_team_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Team Page<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ops_automation_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Ops Automation Overview<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=alanna+ai+title+company\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">AI in Title Operations<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Client Automation Case Studies<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FRAUD V1 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label red-label\">Fraud Awareness<\u002Fdiv>\n    <div class=\"brief-fraud-card\">\n      <div class=\"bfc-header\">\n        <div>\n          <div class=\"bfc-tag\">Two Patterns · Cyber411.ai Reference<\u002Fdiv>\n          <div class=\"bfc-name\">The Patient Attack &amp; The Display Name Trick<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"bfc-badge\">Wire Fraud<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"bfc-body\">\n        <p class=\"bfc-prose\">Two scenarios from Cyber411.ai's awareness library come up consistently in title-adjacent contexts, and both are worth walking through with your team rather than just forwarding as bullet points.<\u002Fp>\n        <div class=\"bfc-callout\">\n          <div class=\"bfc-callout-label\">Pattern 1 — The Patient Attack<\u002Fdiv>\n          <ul class=\"bfc-list\">\n            <li>A fraudster gains access to a real email account and watches for two to three weeks — learning who talks to whom and the transaction timeline.<\u002Fli>\n            <li>Just before closing, they send updated wire instructions from the legitimate, compromised account. No spoofed domain. No fake display name. It's the real email.<\u002Fli>\n            <li>It passes most people's instinctive scan because there's nothing visually wrong.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"bfc-callout\">\n          <div class=\"bfc-callout-label\">Pattern 2 — The Display Name Trick<\u002Fdiv>\n          <ul class=\"bfc-list\">\n            <li>The email shows a familiar display name: \"Sarah Johnson, First National Title.\" Everything looks normal at a glance.<\u002Fli>\n            <li>The actual sending address is sarah.johnson.fnttitle@gmail.com — not the company domain. Almost nobody checks the actual address unless they've been trained to.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"bfc-guidance\">\n          <div class=\"bfc-guidance-label\">What Stops Both of These<\u002Fdiv>\n          <ul class=\"bfc-guidance-list\">\n            <li>Verbally verify all wire instructions using a number already in your records — not a number included in the email itself.<\u002Fli>\n            <li>Inspect the actual sending address on any email that includes wire instructions. It takes three seconds. Do it every time.<\u002Fli>\n            <li>Any mid-transaction change to wire details should trigger a direct phone call before anything else happens.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon red-icon\">⚠<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Fraud Walkthrough — Patient Attack &amp; Display Name Trick<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">ATS team explanation of both fraud patterns with real-world context<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.25%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAG_kccsbKM/zVccJ47DCYjpFsP7cunMcA/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAG_kccsbKM/zVccJ47DCYjpFsP7cunMcA/watch\" target=\"_blank\" class=\"vid-link red-link\" onclick=\"trackEvent('internal_ref_fraud_recording_v1_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://cyber411.ai\" target=\"_blank\" class=\"vid-link red-link\" onclick=\"trackEvent('tool_cyber411_clicked')\">↗ Cyber411.ai<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Fraud References &amp; Resources<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Fraud Intelligence<\u002Fdiv>\n              <a href=\"https://cyber411.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_cyber411_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Cyber411.ai<\u002Fspan><span class=\"ref-link-label\">Resource Hub<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Wire Fraud — Current Patterns<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_wfg_fraud_policy_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">WFG Fraud Awareness Policy<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_fraud_series_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Fraud Awareness Series<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">External Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=wire+fraud+title+company\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Wire Fraud in Title — YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"https://www.alta.org/fraud\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">ALTA Fraud Resources<\u002Fspan><span class=\"ref-link-label\">Industry Ref<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"brief-closing\">\n    <div class=\"brief-closing-label\">ATS Note<\u002Fdiv>\n    <p>This series is part of how the ATS team stays connected to the agent network — not as a broadcast, but as something useful to come back to. Future issues will keep the same format: a couple of tools worth knowing, a fraud pattern worth talking about, and a short note on what any of it means for WFG. If there's a tool or topic you'd like covered, send it to <strong>ATSTeam@wfgtitle.com<\u002Fstrong>.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"brief-issue-nav\">\n    <div><div class=\"bin-label\">Currently Reading<\u002Fdiv><div class=\"bin-title\">Issue 01 — DocAnalyzer, Alanna &amp; Wire Fraud Patterns<\u002Fdiv><\u002Fdiv>\n    <button class=\"bin-btn\" onclick=\"showBriefs('v2')\">Next Issue →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── BRIEF V2 ── -->\n<div id=\"briefs-v2\" class=\"briefs-section\">\n<div class=\"brief-page\">\n  <div class=\"brief-back-nav\">\n    <button class=\"brief-back-btn\" onclick=\"showBriefs('intro')\">← All Briefs<\u002Fbutton>\n    <div class=\"brief-nav-arrows\">\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v1')\">← Prev<\u002Fbutton>\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v3')\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"brief-issue-tag\">Issue 02 · Volume 1 · February 23, 2026<\u002Fdiv>\n  <h1 class=\"brief-title\">Rhino AI, HouseWhisper<br><span class=\"acc\">&amp; the AI-Powered Strike<\u002Fspan><\u002Fh1>\n  <p class=\"brief-intro\">Two tools making agents noticeably faster at listing prep and lead response. And a fraud scenario that uses the exact same AI capabilities to construct more convincing wire fraud attempts. That combination is worth sitting with for a moment — the tools and the threat are drawing from the same well.<\u002Fp>\n\n  <!-- TOOL 1 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 01 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 01<\u002Fdiv>\n          <div class=\"btc-name\">Rhino AI<\u002Fdiv>\n          <div class=\"btc-url\">rhino.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Listing Research<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">Enter a property address and Rhino pulls comps, neighborhood data, and market context automatically, then builds a full listing presentation package from it. What used to take 30 to 60 minutes comes back in under five minutes.<\u002Fp>\n        <p class=\"btc-prose\">For title teams, the ripple effect is worth thinking about. <strong>Higher volume with tighter windows changes what organized title operations look like.<\u002Fstrong> It's not a problem Rhino creates — it's a reality it accelerates.<\u002Fp>\n        <div class=\"btc-highlight\"><p>An agent doing 20 listings a year and cutting prep from 45 minutes to 5 saves roughly 13 hours annually per agent. Multiply across a team or a firm and the volume implications for title become real. More files, moving faster.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Listing Prep<\u002Fspan>\n          <span class=\"btc-tag\">Market Analysis<\u002Fspan>\n          <span class=\"btc-tag\">Agent Efficiency<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — Rhino AI<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Walkthrough: address input to complete listing presentation package<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:65.0340%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHBnbyEIyk/EF5txMxdRNTH2Ms3Saja-g/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHBnbyEIyk/EF5txMxdRNTH2Ms3Saja-g/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v2_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/results?search_query=rhino+ai+listing+presentation\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_rhinoai_youtube_clicked')\">↗ YouTube Tutorial<\u002Fa>\n            <a href=\"https://rhino.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_rhinoai_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://rhino.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_rhinoai_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Rhino AI<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Overview<\u002Fspan><span class=\"ref-link-label\">Product Page<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_agent_enablement_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Agent Enablement Resources<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_field_intelligence_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Field Intelligence Notes<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=rhino+ai+real+estate\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Rhino AI on YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">AI Listing Tools Comparison<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TOOL 2 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 02 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 02<\u002Fdiv>\n          <div class=\"btc-name\">HouseWhisper AI<\u002Fdiv>\n          <div class=\"btc-url\">housewhisper.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Lead Automation<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">HouseWhisper learns an agent's communication style and uses it to respond to inbound leads instantly, handle basic Q&amp;A, and draft follow-up messages while the agent is with a client or showing a property.<\u002Fp>\n        <p class=\"btc-prose\"><strong>Lead conversion is 9 times higher when the response arrives within five minutes versus thirty.<\u002Fstrong> Most agents can't consistently respond within five minutes. HouseWhisper closes that gap.<\u002Fp>\n        <div class=\"btc-highlight\"><p>When agents convert at higher rates and communicate more consistently, pipeline visibility improves. Fewer surprises. More predictable order flow. That makes it easier to staff and schedule.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Lead Response<\u002Fspan>\n          <span class=\"btc-tag\">Pipeline Consistency<\u002Fspan>\n          <span class=\"btc-tag\">Agent Enablement<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — HouseWhisper AI<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Product walkthrough: automated lead response and follow-up drafting<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:65.0340%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHBnVU-syU/S5VEGDNCaw6XX6oSzVtA2A/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHBnVU-syU/S5VEGDNCaw6XX6oSzVtA2A/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v2_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/@HouseWhisperAI\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_housewhisper_youtube_clicked')\">↗ YouTube Channel<\u002Fa>\n            <a href=\"https://www.housewhisper.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_housewhisper_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://www.housewhisper.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_housewhisper_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">HouseWhisper AI<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/@HouseWhisperAI\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_housewhisper_youtube_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Demos<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_fieldiq_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">FieldIQ SalesCRM Overview<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_agent_enablement_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Agent Enablement Notes<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=AI+real+estate+lead+response\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">AI Lead Response Tools<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Lead Conversion Research<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FRAUD V2 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label red-label\">Fraud Awareness<\u002Fdiv>\n    <div class=\"brief-fraud-card\">\n      <div class=\"bfc-header\">\n        <div>\n          <div class=\"bfc-tag\">Active &amp; Documented Pattern<\u002Fdiv>\n          <div class=\"bfc-name\">Wire Fraud Is Getting Smarter — The AI-Assisted Attack<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"bfc-badge\">Elevated Risk<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"bfc-body\">\n        <p class=\"bfc-prose\">The same AI that makes the tools above fast and convincing is now being used to make wire fraud harder to detect. This isn't theoretical. The pattern below describes an active, documented attack methodology appearing more frequently in real estate transactions.<\u002Fp>\n        <div class=\"bfc-callout\">\n          <div class=\"bfc-callout-label\">How the Attack Sequence Works<\u002Fdiv>\n          <ul class=\"bfc-list\">\n            <li><strong>Weeks 1–3, surveillance only:<\u002Fstrong> The attacker compromises an email account and does nothing visible. They study communication patterns, transaction timelines, and who has authority over wire decisions.<\u002Fli>\n            <li><strong>Week 4, the strike:<\u002Fstrong> AI drafts an email using the agent's exact tone and language, references the correct property, and sends it at 4 PM the day before closing — when pressure is highest and scrutiny is lowest.<\u002Fli>\n            <li><strong>The spoofing layer:<\u002Fstrong> The display name shows a trusted person. The sending domain is a near-match — wellsfarg0.com instead of wellsfargo.com.<\u002Fli>\n            <li><strong>The urgency frame:<\u002Fstrong> \"Must fund today.\" The time pressure is engineered — it's the mechanism that discourages verification.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"bfc-guidance\">\n          <div class=\"bfc-guidance-label\">What Actually Stops This<\u002Fdiv>\n          <ul class=\"bfc-guidance-list\">\n            <li>Call to verify any wire changes using a number already in your records — not one from the email.<\u002Fli>\n            <li>Hover the sender display name and inspect the real address. Three seconds, every time.<\u002Fli>\n            <li>Educate clients about wire fraud at the start of the transaction — at first contact, not the day before close.<\u002Fli>\n            <li>Re-verify wire details immediately before funding, even if they were confirmed the day prior.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon red-icon\">⚠<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Fraud Walkthrough — AI-Assisted Wire Attack Sequence<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">ATS team walkthrough of the full attack pattern with email examples<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:65.0340%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHBngiu04w/a-M_lj6X7z8kL2JzdDQgFw/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHBngiu04w/a-M_lj6X7z8kL2JzdDQgFw/watch\" target=\"_blank\" class=\"vid-link red-link\" onclick=\"trackEvent('internal_ref_fraud_recording_v2_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"#\" class=\"vid-link red-link\" onclick=\"trackEvent('internal_ref_wfg_fraud_awareness_clicked')\">WFG Fraud Awareness Reference<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Fraud References &amp; Resources<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Fraud Intelligence<\u002Fdiv>\n              <a href=\"https://cyber411.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_cyber411_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Cyber411.ai<\u002Fspan><span class=\"ref-link-label\">Resource Hub<\u002Fspan><\u002Fa>\n              <a href=\"https://www.ic3.gov\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">FBI IC3 — BEC Reports<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_wfg_fraud_policy_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">WFG Wire Fraud Policy<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_fraud_series_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Fraud Awareness Series<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">External Learning<\u002Fdiv>\n              <a href=\"https://www.alta.org/fraud\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">ALTA Fraud Resources<\u002Fspan><span class=\"ref-link-label\">Industry<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/results?search_query=wire+fraud+real+estate+AI\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Wire Fraud + AI — YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"brief-closing\">\n    <div class=\"brief-closing-label\">ATS Observation<\u002Fdiv>\n    <p>The overlap between the tools that make agents more productive and the tools that make fraud harder to detect is not a coincidence — it's the same underlying capability applied differently. The fraud pattern in this issue is worth explaining out loud to your team, not just sharing as a document.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"brief-issue-nav\">\n    <div><div class=\"bin-label\">Currently Reading<\u002Fdiv><div class=\"bin-title\">Issue 02 — Rhino AI, HouseWhisper &amp; the AI-Powered Strike<\u002Fdiv><\u002Fdiv>\n    <button class=\"bin-btn\" onclick=\"showBriefs('v3')\">Next Issue →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── BRIEF V3 ── -->\n<div id=\"briefs-v3\" class=\"briefs-section\">\n<div class=\"brief-page\">\n  <div class=\"brief-back-nav\">\n    <button class=\"brief-back-btn\" onclick=\"showBriefs('intro')\">← All Briefs<\u002Fbutton>\n    <div class=\"brief-nav-arrows\">\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v2')\">← Prev<\u002Fbutton>\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v4')\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"brief-issue-tag\">Issue 03 · Volume 1 · March 2026<\u002Fdiv>\n  <h1 class=\"brief-title\">Orbital, PalmAgent<br><span class=\"acc\">&amp; a Seller Impersonation Case<\u002Fspan><\u002Fh1>\n  <p class=\"brief-intro\">Two tools that reduce friction at different points in the workflow. And a fraud case drawn from an actual file review — one where the flags weren't hidden, just distributed across the file in a way that's easy to miss when you're managing multiple closings and working against a deadline.<\u002Fp>\n\n  <!-- TOOL 1 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 01 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 01<\u002Fdiv>\n          <div class=\"btc-name\">Orbital<\u002Fdiv>\n          <div class=\"btc-url\">getorbital.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Document Review<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">Orbital reads through title reports, surveys, and legal descriptions and surfaces the parts that typically warrant the most attention — ownership history, encumbrances, legal description issues, anything that could create a problem at closing.<\u002Fp>\n        <p class=\"btc-prose\">The judgment call stays with the reviewer. <strong>Manual review of a typical document package runs 30 to 90 minutes. The general estimate for time-to-surface-key-sections with Orbital is around half that.<\u002Fstrong><\u002Fp>\n        <div class=\"btc-highlight\"><p>For examiners carrying multiple simultaneous files, this kind of compression matters week over week. The work doesn't get easier — but the navigation does, which frees up attention for the places where experience actually counts.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Title Examination<\u002Fspan>\n          <span class=\"btc-tag\">Document Review<\u002Fspan>\n          <span class=\"btc-tag\">Multi-File Workflows<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — Orbital<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Walkthrough: title report review, surfacing key sections and encumbrances<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.2500%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHDqQRqFD4/_70V10Aa2d99tKGDvNashQ/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHDqQRqFD4/_70V10Aa2d99tKGDvNashQ/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v3_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/results?search_query=orbital+AI+title+document+review\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_orbital_youtube_clicked')\">↗ YouTube Tutorial<\u002Fa>\n            <a href=\"https://www.getorbital.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_orbital_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://www.getorbital.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_orbital_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Orbital<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Overview<\u002Fspan><span class=\"ref-link-label\">Product Page<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_doc_ai_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Document AI Resources<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_title_exam_standards_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Title Examination Standards<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=orbital+AI+title\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Orbital AI — YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/results?search_query=AI+real+estate+document+analysis\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">AI Document Review Context<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TOOL 2 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 02 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 02<\u002Fdiv>\n          <div class=\"btc-name\">PalmAgent<\u002Fdiv>\n          <div class=\"btc-url\">palmagent.com<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Closing Cost Estimates<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">PalmAgent calculates seller net sheets and buyer closing cost estimates in under 30 seconds — commissions, taxes, title fees, assumed costs — while a client conversation is still happening.<\u002Fp>\n        <p class=\"btc-prose\"><strong>When numbers appear in real time, the conversation stays on the decision rather than the arithmetic.<\u002Fstrong> Agents who run cleaner financial conversations tend to have fewer last-minute number surprises at closing.<\u002Fp>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Net Sheets<\u002Fspan>\n          <span class=\"btc-tag\">Closing Estimates<\u002Fspan>\n          <span class=\"btc-tag\">Agent-Client Conversations<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — PalmAgent<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Walkthrough: net sheet and closing cost estimate generation during a live conversation<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.2500%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHDqmX8zAI/4O2uBHI4hwo82p3eDj34vg/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHDqmX8zAI/4O2uBHI4hwo82p3eDj34vg/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v3_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/results?search_query=palmagent+net+sheet+demo\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_palmagent_youtube_clicked')\">↗ YouTube Demo<\u002Fa>\n            <a href=\"https://www.palmagent.com\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_palmagent_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://www.palmagent.com\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_palmagent_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">PalmAgent<\u002Fspan><span class=\"ref-link-label\">Official Site<\u002Fspan><\u002Fa>\n              <a href=\"https://www.youtube.com/results?search_query=palmagent+real+estate\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Product Demos<\u002Fspan><span class=\"ref-link-label\">YouTube<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_wfg_net_sheet_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">WFG Net Sheet Process<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_agent_tx_resources_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">Agent Transaction Resources<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">Tutorials &amp; Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=net+sheet+closing+cost+tool\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Closing Cost Tools — YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Real Estate Financial Prep<\u002Fspan><span class=\"ref-link-label\">Reference<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FRAUD V3 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label red-label\">Fraud Awareness<\u002Fdiv>\n    <div class=\"brief-fraud-card\">\n      <div class=\"bfc-header\">\n        <div>\n          <div class=\"bfc-tag\">Case Review — Actual File<\u002Fdiv>\n          <div class=\"bfc-name\">Seller Impersonation, POA Fraud &amp; Identity Fabrication<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"bfc-badge\">Documented Case<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"bfc-body\">\n        <p class=\"bfc-prose\">This scenario came from a real file review. A seller inquiry arrived, documents followed promptly, and the transaction started moving like a normal cash close. What the review eventually surfaced was a layered impersonation attempt.<\u002Fp>\n        <div class=\"bfc-callout\">\n          <div class=\"bfc-callout-label\">How the File Developed<\u002Fdiv>\n          <ul class=\"bfc-list\">\n            <li><strong>Opening:<\u002Fstrong> Seller claims power of attorney on behalf of the owner and requests a fast cash close. The property is vacant with no mortgage — a profile that simplifies the mechanics of this kind of fraud.<\u002Fli>\n            <li><strong>Documents arrive quickly:<\u002Fstrong> A low-resolution driver's license. A notarized POA. Wire instructions routing to a foreign account. Seller is overseas and unavailable for in-person contact.<\u002Fli>\n            <li><strong>Verification declined:<\u002Fstrong> A request for a video call is refused. A 14-day close window creates pressure to keep moving.<\u002Fli>\n            <li><strong>What the review found:<\u002Fstrong> No POA recorded with the county. Document alteration detected on the submitted ID. A fraud risk scan returned a score of 87 out of 100.<\u002Fli>\n            <li><strong>Outcome:<\u002Fstrong> File escalated before closing. Nothing recorded. No funds moved.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"bfc-callout\" style=\"background:rgba(255,78,106,.04);border-color:rgba(255,78,106,.12);\">\n          <div class=\"bfc-callout-label\">The Pattern — When Several of These Appear Together<\u002Fdiv>\n          <ul class=\"bfc-list\">\n            <li>Remote seller with an urgent, compressed close window<\u002Fli>\n            <li>POA claim with no county record to verify it<\u002Fli>\n            <li>Low-quality or potentially altered identity documents<\u002Fli>\n            <li>Resistance when live verification is requested<\u002Fli>\n            <li>Wire instructions routing to a foreign account<\u002Fli>\n            <li>Vacant, free-and-clear property with an absent owner<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"bfc-guidance\">\n          <div class=\"bfc-guidance-label\">ATS Observations on This Case<\u002Fdiv>\n          <ul class=\"bfc-guidance-list\">\n            <li>None of these flags would have been alarming in isolation. The pattern only became clear when viewed together — which is why fraud scoring tools and a second-reviewer culture matter.<\u002Fli>\n            <li>Vacant, free-and-clear properties are a known fraud target profile. This type of file warrants extra scrutiny as a standard practice.<\u002Fli>\n            <li>A fast-moving file and a clean-looking file are not the same thing.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon red-icon\">⚠<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">ATS Walkthrough — Seller Impersonation &amp; POA Fraud<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Full thread explanation of the case — what was found and how the escalation played out<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.2500%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHDqj8acs0/pB3N2FNd2Y0ga9A6bUJA-Q/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHDqj8acs0/pB3N2FNd2Y0ga9A6bUJA-Q/watch\" target=\"_blank\" class=\"vid-link red-link\" onclick=\"trackEvent('internal_ref_fraud_recording_v3_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"#\" class=\"vid-link red-link\" onclick=\"trackEvent('internal_ref_wfg_fraud_awareness_clicked')\">WFG Fraud Awareness Reference<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Fraud References &amp; Resources<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Fraud Intelligence<\u002Fdiv>\n              <a href=\"https://cyber411.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_cyber411_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Cyber411.ai<\u002Fspan><span class=\"ref-link-label\">Resource Hub<\u002Fspan><\u002Fa>\n              <a href=\"https://www.alta.org/fraud\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">ALTA Fraud Resources<\u002Fspan><span class=\"ref-link-label\">Industry<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gold-label\">WFG Internal<\u002Fdiv>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_wfg_fraud_escalation_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">WFG Fraud Escalation Process<\u002Fspan><span class=\"ref-link-label\">Internal<\u002Fspan><\u002Fa>\n              <a href=\"#\" class=\"ref-link\" onclick=\"trackEvent('internal_ref_ats_fraud_series_clicked')\"><span class=\"ref-link-dot gold-dot\"><\u002Fspan><span class=\"ref-link-text\">ATS Fraud Awareness Series<\u002Fspan><span class=\"ref-link-label\">WFG Resource<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label gray-label\">External Learning<\u002Fdiv>\n              <a href=\"https://www.youtube.com/results?search_query=seller+impersonation+real+estate+fraud\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">Seller Impersonation — YouTube<\u002Fspan><span class=\"ref-link-label\">Tutorial<\u002Fspan><\u002Fa>\n              <a href=\"https://www.alta.org/fraud\" target=\"_blank\" class=\"ref-link\"><span class=\"ref-link-dot gray-dot\"><\u002Fspan><span class=\"ref-link-text\">POA Fraud Guidance<\u002Fspan><span class=\"ref-link-label\">ALTA<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"brief-closing\">\n    <div class=\"brief-closing-label\">Closing Note<\u002Fdiv>\n    <p>The signals in that file weren't hidden. They were spread across the transaction in a way that's easy to miss when you're moving quickly across multiple files. <strong>That's exactly where a second look — from a scoring system, a colleague, or simply slowing down — tends to make the difference.<\u002Fstrong> Questions or cases worth reviewing can go to ATSTeam@wfgtitle.com.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"brief-issue-nav\">\n    <div><div class=\"bin-label\">Currently Reading<\u002Fdiv><div class=\"bin-title\">Issue 03 — Orbital, PalmAgent &amp; Seller Impersonation<\u002Fdiv><\u002Fdiv>\n    <button class=\"bin-btn\" onclick=\"showBriefs('v4')\">Next Issue →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── BRIEF V4 ── -->\n<div id=\"briefs-v4\" class=\"briefs-section\">\n<div class=\"brief-page\">\n  <div class=\"brief-back-nav\">\n    <button class=\"brief-back-btn\" onclick=\"showBriefs('intro')\">← All Briefs<\u002Fbutton>\n    <div class=\"brief-nav-arrows\">\n      <button class=\"brief-nav-btn\" onclick=\"showBriefs('v3')\">← Prev<\u002Fbutton>\n      <button class=\"brief-nav-btn\" disabled=\"\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"brief-issue-tag\">Issue 04 · Volume 1 · March 2026<\u002Fdiv>\n  <h1 class=\"brief-title\">Mapify, Perplexity<br><span class=\"red\">&amp; the Payoff Statement Swap<\u002Fspan><\u002Fh1>\n  <p class=\"brief-intro\">Two tools that address different sides of the same underlying problem — making complex information easier to navigate and act on. And a fraud pattern targeting a document every title team handles on every transaction: the payoff statement. It doesn't look foreign. That's the point.<\u002Fp>\n\n  <!-- TOOL 1 -->\n  <div class=\"brief-section\">\n    <div class=\"brief-section-label\">Tool 01 of 02<\u002Fdiv>\n    <div class=\"brief-tool-card\">\n      <div class=\"btc-header\">\n        <div>\n          <div class=\"btc-index\">Tool 01<\u002Fdiv>\n          <div class=\"btc-name\">Mapify.ai<\u002Fdiv>\n          <div class=\"btc-url\">mapify.ai<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btc-badge\">Visual Intelligence<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"btc-body\">\n        <p class=\"btc-prose\">Paste a PDF, video URL, web page, or raw text into Mapify and it converts it into a visual mind map within seconds. The structure becomes navigable rather than linear — which changes how people engage with it, especially when the content is dense or unfamiliar.<\u002Fp>\n        <p class=\"btc-prose\">In title operations: run a state-specific closing procedure document through it and share the map with agents or newer team members. Break down a complex title commitment into a navigable visual. <strong>The output is imperfect but fast, and for reference documents that rarely get read in full, a visual entry point has real value.<\u002Fstrong><\u002Fp>\n        <div class=\"btc-highlight\"><p>Mapify works best as a starting point or summary layer, not a final deliverable. It's most useful when the goal is comprehension and navigation, not precision documentation.<\u002Fp><\u002Fdiv>\n        <div class=\"btc-tags-row\">\n          <span class=\"btc-tag\">Visual Summaries<\u002Fspan>\n          <span class=\"btc-tag\">Training Materials<\u002Fspan>\n          <span class=\"btc-tag\">Client Communication<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vid-placeholder\" style=\"margin-top:20px;\">\n          <div class=\"vid-placeholder-header\">\n            <div class=\"vid-placeholder-icon\">▶<\u002Fdiv>\n            <div>\n              <div class=\"vid-placeholder-title\">Tool Demo — Mapify.ai<\u002Fdiv>\n              <div class=\"vid-placeholder-desc\">Walkthrough: converting a title document into a navigable visual mind map<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:100%;height:0;padding-top:56.2500%;overflow:hidden;\">\n            <iframe loading=\"lazy\" style=\"position:absolute;width:100%;height:100%;top:0;left:0;border:none;padding:0;margin:0;\" src=\"https://www.canva.com/design/DAHDqv7HBVs/yp033MklFmyZleix84M9vQ/watch?embed\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\">\n            <\u002Fiframe>\n          <\u002Fdiv>\n          <div class=\"vid-placeholder-footer\">\n            <a href=\"https://www.canva.com/design/DAHDqv7HBVs/yp033MklFmyZleix84M9vQ/watch\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('internal_ref_ats_walkthrough_v4_clicked')\">↗ Watch on Canva<\u002Fa>\n            <a href=\"https://www.youtube.com/results?search_query=mapify+ai+tutorial\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_mapify_youtube_clicked')\">↗ YouTube Tutorial<\u002Fa>\n            <a href=\"https://mapify.ai\" target=\"_blank\" class=\"vid-link\" onclick=\"trackEvent('tool_mapify_clicked')\">↗ Official Site<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ref-block\">\n          <div class=\"ref-block-title\">Explore Further<\u002Fdiv>\n          <div class=\"ref-groups\">\n            <div class=\"ref-group\">\n              <div class=\"ref-group-label\">Official Tool Links<\u002Fdiv>\n              <a href=\"https://mapify.ai\" target=\"_blank\" class=\"ref-link\" onclick=\"trackEvent('tool_mapify_clicked')\"><span class=\"ref-link-dot\"><\u002Fspan><span class=\"ref-link-text\">Mapify.ai<\u002Fspan><span cl
