  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    --white:#E8F4FF;--gray:#6A8099;--lightgray:#A8C0D4;\n    --teal:#4BBFE8;\n  }\n  *{margin:0;padding:0;box-sizing:border-box;}\n  body{font-family:'Inter',sans-serif;background:#060C17;color:var(--white);line-height:1.6;}\n  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(4,8,16,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(75,191,232,.1);padding:14px 48px;display:flex;align-items:center;justify-content:space-between;}\n  .nav-logo{font-size:12px;font-weight:800;letter-spacing:2.5px;color:var(--teal);text-transform:uppercase;}\n  .nav-links{display:flex;gap:24px;}\n  .nav-links a{font-size:11px;font-weight:500;letter-spacing:1.5px;color:var(--gray);text-decoration:none;text-transform:uppercase;transition:color .2s,background .2s;}\n  .nav-links a:hover{color:#4BBFE8;}\n  .page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:100px 60px 80px;max-width:1100px;margin:0 auto;position:relative;}\n  .full-bleed-page{background:rgba(255,255,255,.012);border-top:1px solid rgba(75,191,232,.06);border-bottom:1px solid rgba(75,191,232,.06);}\n  .full-bleed-inner{max-width:1100px;margin:0 auto;padding:100px 60px 80px;}\n  .section-tag{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--teal);text-transform:uppercase;margin-bottom:14px;}\n  h1{font-size:clamp(56px,8vw,104px);font-weight:900;line-height:0.97;letter-spacing:-3px;margin-bottom:28px;}\n  h1 span{color:var(--teal);}\n  h2{font-size:clamp(30px,4vw,50px);font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:18px;}\n  h2 .accent{color:var(--teal);}h2 .gold{color:var(--gold);}\n  .lead{font-size:18px;font-weight:300;color:var(--gray);max-width:640px;line-height:1.8;margin-bottom:48px;}\n  .divider{width:64px;height:2px;background:linear-gradient(90deg,#4BBFE8,rgba(75,191,232,.2));margin:16px 0 36px;border-radius:2px;}\n  .divider.gold{background:var(--gold);}\n  .page-num{position:absolute;bottom:40px;right:60px;font-size:80px argin-bottom:10px;}\n  .pillar-num{font-size:44px;font-weight:900;color:rgba(75,191,232,.12);line-height:1;}\n  .pillar-title{font-size:19px;font-weight:700;}\n  .pillar p{font-size:13.5px;color:var(--gray);max-width:720px;line-height:1.8;}\n  .pillar-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}\n  .badge{font-size:10px;font-weight:600;letter-spacing:.8px;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--gray);}\n  .impact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}\n  .impact-item{background:rgba(11,21,37,.7);backdrop-filter:blur(10px);border-radius:12px;padding:26px;border:1px solid rgba(255,255,255,.06);transition:border-color .3s;}\n  .audience{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}\n  .impact-item h4{font-size:16px;font-weight:700;margin-bottom:10px;}\n  .impact-item ul{list-style:none;}\n  .impact-item ul li{font-size:12.5px;color:var(--gray);padding:4px 0 4px 16px;position:relative;}\n  .impact-item ul li::before{content:'→';position:absolute;left:0;color:var(--teal);font-size:11px;line-height:1.9;}\n  .diff-split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:40px;}\n  .diff-col{background:var(--navy2);border-radius:12px;padding:30px;border:1px solid rgba(255,255,255,.05);}\n  .diff-col.active{border-color:rgba(75,191,232,.35);box-shadow:0 0 20px rgba(75,191,232,.07);}\n  .diff-col-label{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);}\n  .diff-col-label.not{color:var(--gray);}\n  .diff-col-label.is{color:var(--teal);}\n  .diff-col ul{list-style:none;}\n  .diff-col ul li{font-size:13px;color:var(--gray);padding:7px 0 7px 20px;border-bottom:1px solid rgba(255,255,255,.04);position:relative;}\n  .diff-col.not ul li::before{content:'✕';position:absolute ion-tag {\n    background: linear-gradient(90deg, transparent, rgba(75,191,232,.06), transparent);\n    padding: 2px 0;\n  }\n  .hero-eyebrow {\n    letter-spacing: 4px;\n  }\n\n  /* ══════════════════════════════════════\n     UPGRADED PILLAR NUMS\n  ══════════════════════════════════════ */\n  .pillar-num {\n    background: linear-gradient(135deg, rgba(125,223,245,.25), rgba(75,191,232,.1));\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    background-clip: text;\n  }\n\n  /* ══════════════════════════════════════\n     GRADIENT DIVIDERS\n  ══════════════════════════════════════ */\n  .divider.gold {\n    background: linear-gradient(90deg, var(--gold), rgba(232,147,74,.3)) !important;\n  }\n\n  /* ══════════════════════════════════════\n     3D DEPTH — CARDS & PANELS\n     Matches the volumetric depth of the image\n  ══════════════════════════════════════ */\n  .card, .team-card, .contact-block, .cat-card, .impact-item,\n  .diff-col, .pt-card, .db-item, .brief-issue-card {\n    background: linear-gradient(145deg, rgba(12,22,40,.72), rgba(6,12,22,.82)) !important;\n    backdrop-filter: blur(18px) !important;\n    -webkit-backdrop-filter: blur(18px) !important;\n    border: 1px solid rgba(75,191,232,.1) !important;\n    box-shadow: \n      0 1px 0 rgba(125,223,245,.07) inset,\n      0 -1px 0 rgba(0,0,0,.4) inset,\n      0 4px 24px rgba(0,0,0,.4),\n      0 1px 3px rgba(0,0,0,.6) !important;\n  }\n  .card:hover, .team-card:hover, .contact-block:hover, .cat-card:hover {\n    border-color: rgba(75,191,232,.28) !important;\n    box-shadow: \n      0 1px 0 rgba(125,223,245,.12) inset,\n      0 -1px 0 rgba(0,0,0,.4) inset,\n      0 0 28px rgba(75,191,232,.12),\n      0 8px 40px rgba(0,0,0,.5) !important;\n  }\n\n  /* Raised top-edge highlight — like light hitting a physical panel */\n  .card::before, .team-card::before, .contact-block::before {\n    content: '';\n    position: absolute;\n    top: 0; left: 10%; right: 10%;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, rgba(125,223,245,.3), transparent);\n    border-radius: 50%;\n    pointer-events: none;\n  }\n  .card, .team-card, .contact-block { position: relative; overflow: hidden; }\n\n  /* Page sections — subtle translucent depth layers */\n  .full-bleed-page {\n    background: rgba(4,8,16,.3) !important;\n    border-top: 1px solid rgba(75,191,232,.07) !important;\n    border-bottom: 1px solid rgba(75,191,232,.07) !important;\n    backdrop-filter: blur(4px);\n  }\n\n  /* Quote block — glass */\n  .quote-block {\n    background: linear-gradient(135deg, rgba(12,24,42,.6), rgba(6,14,28,.7)) !important;\n    backdrop-filter: blur(12px);\n    border-radius: 0 10px 10px 0;\n    box-shadow: 0 4px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(125,223,245,.07);\n  }\n\n  /* Forward/CTA block */\n  .forward {\n    background: linear-gradient(145deg, rgba(10,20,36,.8), rgba(6,12,22,.9)) !important;\n    box-shadow: \n      0 1px 0 rgba(125,223,245,.08) inset,\n      0 24px 60px rgba(0,0,0,.5) !important;\n  }\n\n  /* ══════════════════════════════════════\n     PREMIUM FOOTER\n  ══════════════════════════════════════ */\n  footer {\n    border-top: 1px solid rgba(75,191,232,.1) !important;\n    background: linear-gradient(180deg, transparent, rgba(75,191,232,.02));\n  }\n\n  /* ══════════════════════════════════════\n     ENHANCED HERO STATS\n  ══════════════════════════════════════ */\n  .hero-stat .num {\n    background: linear-gradient(135deg, #7DDFF5, #4BBFE8);\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    background-clip: text;\n  }\n  .fstat .n {\n    background: linear-gradient(135deg, #7DDFF5, #4BBFE8);\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    background-clip: text;\n  }\n\n  /* ══════════════════════════════════════\n     BRIEF CARDS UPGRADE\n  ══════════════════════════════════════ */\n  .brief-issue-card {\n    background: rgba(11,21,37,.75) !important;\n    backdrop-filter: blur(10px);\n  }\n  .brief-issue-card:hover {\n    box-shadow: 0 0 20px rgba(75,191,232,.1) !important;\n  }\n\n  /* ══════════════════════════════════════\n     LIVE BADGE UPGRADE\n  ══════════════════════════════════════ */\n  .live-badge {\n    background: linear-gradient(135deg, rgba(75,191,232,.1), rgba(42,125,181,.05)) !important;\n    border-color: rgba(75,191,232,.25) !important;\n  }\n\n  /* ══════════════════════════════════════\n     NAV LOGO GRADIENT\n  ══════════════════════════════════════ */\n  .nav-logo {\n    background: linear-gradient(135deg, #7DDFF5, #4BBFE8);\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    background-clip: text;\n  }\n\n  /* ══════════════════════════════════════\n     PHASE TIMELINE DOTS UPGRADE\n  ══════════════════════════════════════ */\n  .phase-timeline::before {\n    background: linear-gradient(90deg, rgba(75,191,232,.4), rgba(42,125,181,.3), rgba(232,147,74,.3)) !important;\n  }\n\n  /* ══════════════════════════════════════\n     DIAGRAM WRAP UPGRADE\n  ══════════════════════════════════════ */\n  .diagram-wrap {\n    background: rgba(11,21,37,.6) !important;\n    border-color: rgba(75,191,232,.15) !important;\n    backdrop-filter: blur(8px);\n  }\n\n<\u002Fstyle>\n  <!-- Microsoft Clarity Tracking (Replace CLARITY_ID_HERE with actual ID) -->\n  <script type=\"text/javascript\">\n    (function(c,l,a,r,i,t,y){\n        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};\n        t=l.createElement(r);t.async=1;t.src=\"https://www.clarity.ms/tag/\"+i;\n        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);\n    })(window, document, \"clarity\", \"script\", \"w1v81us7dt\");\n  <\u002Fscript>\n<\u002Fhead>\n<body>\n<div class=\"bg-glow\"><\u002Fdiv>\n<div class=\"bg-glow2\"><\u002Fdiv>\n\n<!-- Cinematic wave overlay — matches brochure background -->\n<canvas id=\"waveCanvas\" style=\"position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:1;\"><\u002Fcanvas>\n<script>\n(function(){\n  var canvas = document.getElementById('waveCanvas');\n  var ctx = canvas.getContext('2d');\n  var W, H, t = 0;\n\n  function resize(){\n    W = canvas.width = window.innerWidth;\n    H = canvas.height = window.innerHeight;\n  }\n  window.addEventListener('resize', resize);\n  resize();\n\n  // Wave ribbon definition\n  function waveY(x, amplitude, frequency, phase, offset){\n    return offset + amplitude * Math.sin(frequency * x + phase);\n  }\n\n  function drawRibbon(color1, color2, amp, freq, phase, yBase, thickness, blur, alpha){\n    ctx.save();\n    ctx.globalAlpha = alpha;\n    if(blur > 0){\n      ctx.filter = 'blur('+blur+'px)';\n    }\n    // Glow layer (wide, soft)\n    var grd = ctx.createLinearGradient(0, 0, W, 0);\n    grd.addColorStop(0, color1);\n    grd.addColorStop(0.5, color2);\n    grd.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.beginPath();\n    for(var x=0; x<=W; x+=2){\n      var y = waveY(x/W, amp, freq, phase, yBase * H);\n      if(x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.lineWidth = thickness * 2.5;\n    ctx.strokeStyle = grd;\n    ctx.stroke();\n    ctx.restore();\n  }\n\n  function drawDotRibbon(color, amp, freq, phase, yBase, dotSpacing, dotSize, alpha){\n    ctx.save();\n    ctx.globalAlpha = alpha;\n    for(var x=0; x<=W; x+=dotSpacing){\n      var y = waveY(x/W, amp, freq, phase, yBase * H);\n      // Vary dot size slightly for depth\n      var s = dotSize * (0.5 + 0.5 * Math.abs(Math.sin(x * 0.08)));\n      ctx.beginPath();\n      ctx.arc(x, y, s, 0, Math.PI*2);\n      ctx.fillStyle = color;\n      ctx.fill();\n    }\n    ctx.restore();\n  }\n\n  function drawVolumetricGlow(x, y, rx, ry, color, alpha){\n    ctx.save();\n    ctx.globalAlpha = alpha;\n    var grd = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx,ry));\n    grd.addColorStop(0, color);\n    grd.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.scale(1, ry/rx);\n    ctx.beginPath();\n    ctx.arc(x, y*(rx/ry), rx, 0, Math.PI*2);\n    ctx.fillStyle = grd;\n    ctx.fill();\n    ctx.restore();\n  }\n\n  function render(){\n    ctx.clearRect(0, 0, W, H);\n\n    var s = t * 0.00018; // very slow drift\n\n    // ── Deep background volumetric glows ──\n    // Top-right blue atmospheric glow\n    drawVolumetricGlow(W*0.75, H*0.08, W*0.45, H*0.3, 'rgba(30,100,180,0.18)', 1);\n    // Center-left subtle blue depth\n    drawVolumetricGlow(W*0.1, H*0.5, W*0.35, H*0.45, 'rgba(10,60,120,0.12)', 1);\n    // Bottom right dim blue\n    drawVolumetricGlow(W*0.85, H*0.88, W*0.3, H*0.25, 'rgba(30,90,160,0.1)', 1);\n\n    // ── TOP WAVE — the main ribbon (orange→cyan, top-left to right) ──\n    var topAmp  = H * 0.055;\n    var topFreq = 1.4;\n    var topBase = 0.085 + 0.006 * Math.sin(s * 0.7);\n    var topPhase= -0.3 + s * 0.15;\n\n    // Glow underneath (wide orange/amber)\n    drawRibbon(\n      'rgba(232,147,74,0.0)', 'rgba(232,147,74,0.0)', \n      topAmp*1.4, topFreq, topPhase + 0.08, topBase + 0.008,\n      18, 14, 0.9\n    );\n    // Orange glow core\n    ctx.save();\n    ctx.filter = 'blur(16px)';\n    ctx.globalAlpha = 0.55;\n    var og = ctx.createLinearGradient(0,0,W*0.38,0);\n    og.addColorStop(0,'rgba(232,147,74,0.9)');\n    og.addColorStop(0.3,'rgba(180,120,60,0.4)');\n    og.addColorStop(1,'rgba(0,0,0,0)');\n    ctx.beginPath();\n    for(var x=0;x<=W*0.4;x+=2){\n      var y=waveY(x/W,topAmp,topFreq,topPhase,topBase*H);\n      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.lineWidth=28; ctx.strokeStyle=og; ctx.stroke();\n    ctx.restore();\n\n    // Cyan ribbon transition (blends orange to cyan)\n    ctx.save();\n    ctx.filter = 'blur(6px)';\n    ctx.globalAlpha = 0.65;\n    var cg = ctx.createLinearGradient(0,0,W,0);\n    cg.addColorStop(0,'rgba(232,147,74,0.7)');\n    cg.addColorStop(0.2,'rgba(100,200,240,0.9)');\n    cg.addColorStop(0.55,'rgba(75,191,232,0.8)');\n    cg.addColorStop(0.75,'rgba(120,210,245,0.5)');\n    cg.addColorStop(1,'rgba(75,191,232,0.15)');\n    ctx.beginPath();\n    for(var x=0;x<=W;x+=2){\n      var y=waveY(x/W,topAmp,topFreq,topPhase,topBase*H);\n      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.lineWidth=3; ctx.strokeStyle=cg; ctx.stroke();\n    ctx.restore();\n\n    // Bright specular edge (thin, sharp, brightest)\n    ctx.save();\n    ctx.globalAlpha = 0.9;\n    var sg = ctx.createLinearGradient(0,0,W,0);\n    sg.addColorStop(0,'rgba(255,200,130,0.0)');\n    sg.addColorStop(0.08,'rgba(255,200,130,0.5)');\n    sg.addColorStop(0.2,'rgba(150,230,255,0.95)');\n    sg.addColorStop(0.5,'rgba(180,240,255,0.7)');\n    sg.addColorStop(0.75,'rgba(120,210,255,0.4)');\n    sg.addColorStop(1,'rgba(75,191,232,0.1)');\n    ctx.beginPath();\n    for(var x=0;x<=W;x+=2){\n      var y=waveY(x/W,topAmp,topFreq,topPhase,topBase*H);\n      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.lineWidth=1.2; ctx.strokeStyle=sg; ctx.stroke();\n    ctx.restore();\n\n    // Dot mesh on top ribbon\n    ctx.save();\n    for(var x=6;x<=W;x+=7){\n      var y=waveY(x/W,topAmp,topFreq,topPhase,topBase*H);\n      var progress = x/W;\n      var dotAlpha = progress < 0.15 ? 0 : progress < 0.25 ? (progress-0.15)/0.1 * 0.55 : 0.55;\n      if(dotAlpha<=0) continue;\n      var r = progress < 0.5 ? 0.9 : 0.9*(1-(progress-0.5)*1.2);\n      if(r<=0) continue;\n      ctx.globalAlpha = dotAlpha;\n      // Slight scatter\n      for(var row=-2;row<=2;row++){\n        var rowAlpha = Math.max(0, 1 - Math.abs(row)*0.45);\n        ctx.globalAlpha = dotAlpha * rowAlpha * 0.5;\n        ctx.beginPath();\n        ctx.arc(x, y + row*7, r*0.6, 0, Math.PI*2);\n        ctx.fillStyle = row===0 ? 'rgba(180,235,255,0.9)' : 'rgba(75,191,232,0.4)';\n        ctx.fill();\n      }\n    }\n    ctx.restore();\n\n    // ── BOTTOM WAVE — subtle secondary ribbon (cyan, bottom-right) ──\n    var botAmp  = H * 0.035;\n    var botFreq = 1.2;\n    var botBase = 0.88 + 0.004 * Math.sin(s * 0.5 + 1.2);\n    var botPhase= 1.8 + s * 0.12;\n\n    ctx.save();\n    ctx.filter = 'blur(8px)';\n    ctx.globalAlpha = 0.35;\n    var bg2 = ctx.createLinearGradient(W*0.3,0,W,0);\n    bg2.addColorStop(0,'rgba(0,0,0,0)');\n    bg2.addColorStop(0.4,'rgba(42,125,181,0.6)');\n    bg2.addColorStop(0.75,'rgba(75,191,232,0.8)');\n    bg2.addColorStop(1,'rgba(125,223,245,0.3)');\n    ctx.beginPath();\n    for(var x=W*0.3;x<=W;x+=2){\n      var y=waveY(x/W,botAmp,botFreq,botPhase,botBase*H);\n      if(x===W*0.3) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.lineWidth=14; ctx.strokeStyle=bg2; ctx.stroke();\n    ctx.restore();\n\n    ctx.save();\n    ctx.globalAlpha = 0.5;\n    var bs = ctx.createLinearGradient(W*0.3,0,W,0);\n    bs.addColorStop(0,'rgba(0,0,0,0)');\n    bs.addColorStop(0.5,'rgba(125,223,245,0.4)');\n    bs.addColorStop(1,'rgba(125,223,245,0.15)');\n    ctx.beginPath();\n    for(var x=W*0.3;x<=W;x+=2){\n      var y=waveY(x/W,botAmp,botFreq,botPhase,botBase*H);\n      if(x===W*0.3) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.lineWidth=1; ctx.strokeStyle=bs; ctx.stroke();\n    ctx.restore();\n\n    // Dot scatter bottom wave\n    ctx.save();\n    for(var x=W*0.35;x<=W;x+=8){\n      var y=waveY(x/W,botAmp,botFreq,botPhase,botBase*H);\n      var p=(x-W*0.35)/(W*0.65);\n      ctx.globalAlpha=0.25*p;\n      ctx.beginPath();\n      ctx.arc(x,y,0.7,0,Math.PI*2);\n      ctx.fillStyle='rgba(125,223,245,0.9)';\n      ctx.fill();\n    }\n    ctx.restore();\n\n    // ── Right-edge blue vertical light streak ──\n    ctx.save();\n    ctx.filter = 'blur(3px)';\n    ctx.globalAlpha = 0.4;\n    var vs = ctx.createLinearGradient(W-2,0,W-2,H*0.25);\n    vs.addColorStop(0,'rgba(75,191,232,0.9)');\n    vs.addColorStop(1,'rgba(75,191,232,0)');\n    ctx.beginPath();\n    ctx.moveTo(W*0.97, 0); ctx.lineTo(W*0.97, H*0.22);\n    ctx.lineWidth=1.5; ctx.strokeStyle=vs; ctx.stroke();\n    ctx.restore();\n\n    // ── Top-center vertical blue accent ──\n    ctx.save();\n    ctx.f ding:90px 32px 60px;}\n  .v-section-full-inner{padding:80px 32px;}\n  .v-section{padding:80px 32px;}\n  .v-rings-section{padding:60px 32px 80px;}\n  .v-four-grid{grid-template-columns:1fr 1fr;}\n  .v-method-steps{grid-template-columns:1fr 1fr;}\n  .v-mstep:not(:last-child)::after{display:none;}\n  .v-horizon{grid-template-columns:1fr 1fr;}\n  .v-hor-card.h3{grid-column:1 / -1;}\n  .v-manifesto{padding:56px 40px;}\n}\n\n/* ══════════════════════════════════════\n   VISION SECTION RESPONSIVE — MOBILE (≤ 600px)\n══════════════════════════════════════ */\n@media (max-width:600px){\n  .v-hero{padding:80px 16px 52px;}\n  .v-headline{font-size:clamp(44px,16vw,80px);margin-bottom:20px;}\n  .v-sub{font-size:15px;margin-bottom:36px;}\n  .v-kpis{gap:24px;}\n  .v-kpi .n{font-size:38px;}\n  .v-section-full-inner{padding:56px 16px;}\n  .v-section{padding:56px 16px;}\n  .v-rings-section{padding:48px 16px 60px;}\n  .v-stmt{padding:28px 20px;}\n  .v-stmt p{font-size:17px;}\n  .v-four-grid{grid-template-columns:1fr;}\n  .v-quad{padding:28px 20px;}\n  .v-method-steps{grid-template-columns:1fr;}\n  .v-mstep:not(:last-child)::after{display:none;}\n  .v-mstep{padding:24px 18px;}\n  .v-horizon{grid-template-columns:1fr;}\n  .v-hor-card.h3{grid-column:auto;}\n  .v-hor-card{padding:26px 20px;}\n  .v-manifesto{padding:44px 20px;border-radius:14px;}\n  .v-manifesto h2{margin-bottom:20px;}\n  .v-manifesto p{font-size:15px;}\n  .v-ring-visual{overflow-x:auto;-webkit-overflow-scrolling:touch;}\n  .v-ring-visual svg{min-width:640px;}\n}\n<\u002Fstyle>\n\n<!-- HERO -->\n<section class=\"v-hero\">\n  <div class=\"v-eyebrow\">ATS · AI Technology &amp; Solutions · WFG National Title<\u002Fdiv>\n  <h1 class=\"v-headline\">\n    <span class=\"l1\">THE AI<\u002Fspan>\n    <span class=\"l2\">INFRASTRUCTURE<\u002Fspan>\n    <span class=\"l3\">OF REAL ESTATE.<\u002Fspan>\n  <\u002Fh1>\n  <p class=\"v-sub\">ATS is WFG's <strong>research, innovation, and AI deployment engine.<\u002Fstrong> We find the real problems, build tools that actually work, and put them in the hands of agents, realtors, and operators. We move fast, we stay curious, and we keep WFG ahead.<\u002Fp>\n  <div class=\"v-kpis\">\n    <div class=\"v-kpi\"><div class=\"n\">1,744<span style=\"font-size:24px\">+<\u002Fspan><\u002Fdiv><div class=\"l\">Agents in Network<\u002Fdiv><\u002Fdiv>\n    <div class=\"v-kpi\"><div class=\"n gold\">4<\u002Fdiv><div class=\"l\">Quadrants Covered<\u002Fdiv><\u002Fdiv>\n    <div class=\"v-kpi\"><div class=\"n\">94<\u002Fdiv><div class=\"l\">NPS Score<\u002Fdiv><\u002Fdiv>\n    <div class=\"v-kpi\"><div class=\"n gold\">$719M<\u002Fdiv><div class=\"l\">2026 Revenue Target<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CORE MANDATE -->\n<div class=\"v-section-full\">\n<div class=\"v-section-full-inner\">\n  <div class=\"v-label v-reveal\">Core Mandate<\u002Fdiv>\n  <h2 class=\"v-h v-reveal\">What <span class=\"acc\">ATS<\u002Fspan><br>Is Built to Do.<\u002Fh2>\n  <div class=\"v-stmt v-reveal\">\n    <p>ATS exists to ensure that AI is not an abstract capability, but a practical advantage for every individual working with WFG. It empowers every agent, every realtor, every closer, and every operations lead. We anticipate challenges before they surface, translate the potential of AI into purposeful, high-impact solutions, and operationalize them at scale across WFG. We are not only a support function, but also the innovation layer that continuously positions WFG ahead of the industry it operates in.<\u002Fp>\n    <div class=\"attr\">ATS Vision · 2026<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"v-lead v-reveal\">ATS sits at the intersection of research, field intelligence, and engineering. That combination lets us move from a real user pain point to a deployed solution faster than any comparable team in title services.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FOUR QUADRANTS -->\n<div class=\"v-section\">\n  <div class=\"v-label v-reveal\">Strategic Coverage<\u002Fdiv>\n  <h2 class=\"v-h v-reveal\">All Three <span class=\"acc\">Bases.<\u002Fspan><br>One <span class=\"gold\">Team.<\u002Fspan><\u002Fh2>\n  <p class=\"v-lead v-reveal\">ATS is the only team in WFG with a mandate that spans every operational channel. Agency East, internal operations and external tools. That full coverage is what makes what we build so much more valuable than point solutions.<\u002Fp>\n  <div class=\"v-four-grid v-reveal\">\n    <div class=\"v-quad q1\">\n      <div class=\"v-quad-icon\">🤝<\u002Fdiv>\n      <div class=\"v-quad-axis\"><span class=\"v-pill v-pill-teal\">Agency East<\u002Fspan><span style=\"color:#7A8BA8;font-size:9px;font-weight:700;letter-spacing:2px;\">EXTERNAL TOOLS<\u002Fspan><\u002Fdiv>\n      <h3>Agent-Facing Tools<\u002Fh3>\n      <p>Tools agents use directly in their day-to-day work. eRemit handles remittance, FieldIQ gives agents a real CRM built for small teams, and the FAR/BAR Smart Deadline Calculator removes one of the most common sources of transaction confusion. Fraud Detection AI sits here too, surfacing risk before it becomes a problem.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"v-quad q2\">\n      <div class=\"v-quad-icon\">🏠<\u002Fdiv>\n      <div class=\"v-quad-axis\"><span class=\"v-pill v-pill-gold\">Direct West<\u002Fspan><span style=\"color:#7A8BA8;font-size:9px;font-weight:700;letter-spacing:2px;\">EXTERNAL TOOLS<\u002Fspan><\u002Fdiv>\n      <h3>Realtor Ecosystem<\u002Fh3>\n      <p>Direct is earlier in the ATS journey and we are building it with the same intentionality. MyHomePrompts Advisor WFG gives realtors a conversational AI engine for marketing and client engagement. The ALTA Chatbot Partnership, currently in planning, will extend that reach company-wide. Fraud Detection AI covers this side as well.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"v-quad q3\">\n      <div class=\"v-quad-icon\">⚙️<\u002Fdiv>\n      <div class=\"v-quad-axis\"><span class=\"v-pill v-pill-teal\">Agency East<\u002Fspan><span style=\"color:#7A8BA8;font-size:9px;font-weight:700;letter-spacing:2px;\">INTERNAL OPS<\u002Fspan><\u002Fdiv>\n      <h3>Agency Operations<\u002Fh3>\n      <p>The back-office layer that quietly removes friction from every file. AATP tracks agent applications, the ATS Discovery Bot gives internal staff a structured way to surface requests to ATS, Title Search Statements go out automatically, OKR Automation keeps leadership informed, and MuleSoft plus Salesforce tie the systems together. Knowledge Bases ensure nothing lives only in someone's inbox.<\u002Fp>\n    <\u002Fdiv>\n    <!-- <div class=\"v-quad q4\">\n      <div class=\"v-quad-icon\">🔬<\u002Fdiv>\n      <div class=\"v-quad-axis\"><span class=\"v-pill v-pill-gold\">Direct West<\u002Fspan><span style=\"color:#7A8BA8;font-size:9px;font-weight:700;letter-spacing:2px;\">INTERNAL OPS<\u002Fspan><\u002Fdiv>\n      <h3>Direct Operations<\u002Fh3>\n      <p>ATS Intelligence Briefs keeps both Agency and Direct teams informed and sharp, with fraud awareness content reaching the whole network bi-weekly. The Fraud Awareness Series runs alongside it. Fraud Detection R&amp;D operates at the internal level here too, ensuring Direct operations have the same rigour and protection as the rest of the business.<\u002Fp>\n    <\u002Fdiv> -->\n  <\u002Fdiv>\n  <div class=\"v-stmt v-reveal\" style=\"border-left-color:#E8934A;margin-top:0;\">\n    <p><strong style=\"color:#E8934A;\">Fraud Detection sits across all three channels.<\u002Fstrong> It is the one initiative that does not belong to a single channel. It protects agents externally, supports staff internally, and covers Agency East. That is by design.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"v-connector\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- INITIATIVE MAP SVG -->\n<!-- <div class=\"v-rings-section\">\n  <div class=\"v-label v-reveal\">Initiative Map<\u002Fdiv>\n  <h2 class=\"v-h v-reveal\">How <span class=\"acc\">ATS<\u002Fspan><br>Covers <span class=\"gold\">All Three Bases.<\u002Fspan><\u002Fh2>\n  <p class=\"v-lead v-reveal\">Every ATS initiative maps to one of three operational zones. Agency East on the right, Direct West on the left. External tools above the line, internal operations below. Fraud Detection R&amp;D is the one initiative that runs through all three.<\u002Fp>\n  <div class=\"v-ring-visual v-reveal\">\n    <svg viewBox=\"0 0 1100 820\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block;\">\n      <defs>\n        <radialGradient id=\"v-coreGlow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"0%\" stop-color=\"#4BBFE8\" stop-opacity=\"0.3\"/>\n          <stop offset=\"100%\" stop-color=\"#4BBFE8\" stop-opacity=\"0\"/>\n        <\u002FradialGradient>\n        <filter id=\"v-glow\"><feGaussianBlur stdDeviation=\"2.5\" result=\"coloredBlur\"/><feMerge><feMergeNode in=\"coloredBlur\"/><feMergeNode in=\"SourceGraphic\"/><\u002FfeMerge><\u002Ffilter>\n        <filter id=\"v-softglow\"><feGaussianBlur stdDeviation=\"8\" result=\"coloredBlur\"/><feMerge><feMergeNode in=\"coloredBlur\"/><feMergeNode in=\"SourceGraphic\"/><\u002FfeMerge><\u002Ffilter>\n      <\u002Fdefs>\n      <rect x=\"552\" y=\"40\" width=\"508\" height=\"360\" fill=\"rgba(75,191,232,0.025)\"/>\n      <rect x=\"552\" y=\"420\" width=\"508\" height=\"360\" fill=\"rgba(232,147,74,0.02)\"/>\n      <rect x=\"40\" y=\"40\" width=\"508\" height=\"360\" fill=\"rgba(75,191,232,0.018)\"/>\n      <rect x=\"40\" y=\"420\" width=\"508\" height=\"360\" fill=\"rgba(232,147,74,0.015)\"/>\n      <line x1=\"550\" y1=\"40\" x2=\"550\" y2=\"780\" stroke=\"rgba(255,255,255,0.1)\" stroke-width=\"1.5\"/>\n      <line x1=\"40\" y1=\"410\" x2=\"1060\" y2=\"410\" stroke=\"rgba(255,255,255,0.1)\" stroke-width=\"1.5\"/>\n      <text x=\"1050\" y=\"68\" text-anchor=\"end\" font-family=\"'Bebas Neue',sans-serif\" font-size=\"15\" fill=\"#4BBFE8\" opacity=\"0.5\" letter-spacing=\"3\">AGENCY / EAST<\u002Ftext>\n      <text x=\"1050\" y=\"86\" text-anchor= =\"350\" y2=\"240\" stroke=\"#4BBFE8\" stroke-width=\"1\" opacity=\"0.3\"/>\n      <circle cx=\"344\" cy=\"234\" r=\"7\" fill=\"#4BBFE8\" opacity=\"0.9\" filter=\"url(#v-glow)\"/>\n      <rect x=\"158\" y=\"218\" width=\"178\" height=\"38\" rx=\"6\" fill=\"#0B1830\" stroke=\"#4BBFE8\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n      <text x=\"247\" y=\"233\" text-anchor=\"middle\" font-family=\"'DM Sans',sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#F4F7FB\">MyHomePrompts Advisor WFG<\u002Ftext>\n      <text x=\"247\" y=\"247\" text-anchor=\"middle\" font-family=\"'DM Mono',monospace\" font-size=\"8\" fill=\"#4BBFE8\">Direct · External<\u002Ftext>\n      <line x1=\"492\" y1=\"442\" x2=\"360\" y2=\"520\" stroke=\"#4BBFE8\" stroke-width=\"1\" stroke-dasharray=\"3,3\" opacity=\"0.35\"/>\n      <circle cx=\"354\" cy=\"526\" r=\"7\" fill=\"#4BBFE8\" opacity=\"0.85\" filter=\"url(#v-glow)\"/>\n      <rect x=\"168\" y=\"510\" width=\"178\" height=\"38\" rx=\"6\" fill=\"#0B1830\" stroke=\"#4BBFE8\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n      <text x=\"257\" y=\"525\" text-anchor=\"middle\" font-family=\"'DM Sans',sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#F4F7FB\">Intelligence Brief<\u002Ftext>\n      <text x=\"257\" y=\"539\" text-anchor=\"middle\" font-family=\"'DM Mono',monospace\" font-size=\"8\" fill=\"#4BBFE8\">Agency + Direct · Internal<\u002Ftext>\n      <line x1=\"484\" y1=\"456\" x2=\"300\" y2=\"614\" stroke=\"#E8934A\" stroke-width=\"1\" opacity=\"0.3\"/>\n      <circle cx=\"294\" cy=\"620\" r=\"7\" fill=\"#E8934A\" opacity=\"0.9\" filter=\"url(#v-glow)\"/>\n      <rect x=\"108\" y=\"604\" width=\"178\" height=\"38\" rx=\"6\" fill=\"#0B1830\" stroke=\"#E8934A\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n      <text x=\"197\" y=\"619\" text-anchor=\"middle\" font-family=\"'DM Sans',sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#F4F7FB\">Fraud Awareness Series<\u002Ftext>\n      <text x=\"197\" y=\"633\" text-anchor=\"middle\" font-family=\"'DM Mono',monospace\" font-size=\"8\" fill=\"#E8934A\">Direct · Internal<\u002Ftext>\n      <ellipse cx=\"550\" cy=\"410\" rx=\"110\" ry=\"82\" fill=\"none\" stroke=\"#FF4E6A\" stroke-width=\"1.2\" stroke-dasharray=\"3,5\" opacity=\"0.45\"/>\n      <text x=\"550\" y=\"320\" text-anchor=\"middle\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#FF4E6A\" opacity=\"0.75\" letter-spacing=\"2\">FRAUD DETECTION R&amp;D · ALL 4 QUADRANTS<\u002Ftext>\n      <ellipse cx=\"550\" cy=\"410\" rx=\"480\" ry=\"360\" fill=\"none\" stroke=\"#E8934A\" stroke-width=\"1\" stroke-dasharray=\"5,10\" opacity=\"0.12\"/>\n      <circle cx=\"550\" cy=\"55\" r=\"5\" fill=\"#E8934A\" opacity=\"0.45\"/>\n      <text x=\"550\" y=\"42\" text-anchor=\"middle\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#E8934A\" opacity=\"0.55\" letter-spacing=\"2\">ALTA CHATBOT PARTNERSHIP · IN PLANNING · COMPANY WIDE<\u002Ftext>\n      <rect x=\"380\" y=\"790\" width=\"10\" height=\"10\" rx=\"2\" fill=\"#4BBFE8\" opacity=\"0.85\"/>\n      <text x=\"396\" y=\"800\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#7A8BA8\" letter-spacing=\"1\">External<\u002Ftext>\n      <rect x=\"470\" y=\"790\" width=\"10\" height=\"10\" rx=\"2\" fill=\"#E8934A\" opacity=\"0.85\"/>\n      <text x=\"486\" y=\"800\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#7A8BA8\" letter-spacing=\"1\">Internal<\u002Ftext>\n      <rect x=\"560\" y=\"790\" width=\"10\" height=\"10\" rx=\"2\" fill=\"#FF4E6A\" opacity=\"0.75\"/>\n      <text x=\"576\" y=\"800\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#7A8BA8\" letter-spacing=\"1\">Cross-cutting<\u002Ftext>\n      <rect x=\"672\" y=\"790\" width=\"10\" height=\"10\" rx=\"2\" fill=\"#E8934A\" opacity=\"0.3\"/>\n      <text x=\"688\" y=\"800\" font-family=\"'DM Mono',monospace\" font-size=\"9\" fill=\"#7A8BA8\" letter-spacing=\"1\">In Planning<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n<\u002Fdiv> -->\n\n<!-- METHODOLOGY -->\n<div class=\"v-section-full\">\n<div class=\"v-section-full-inner\">\n  <div class=\"v-label v-reveal\">How We Work<\u002Fdiv>\n  <h2 class=\"v-h v-reveal\">The <span class=\"acc\">Process<\u002Fspan><br>That Separates <span class=\"gold\">Us.<\u002Fspan><\u002Fh2>\n  <p class=\"v-lead v-reveal\">ATS follows a disciplined, repeatable process that keeps users at the center of every decision. It is not a framework written on a wall. It is genuinely how this team thinks, and it is why what we ship actually gets used.<\u002Fp>\n  <div class=\"v-method-steps v-reveal\">\n    <div class=\"v-mstep\"><div class=\"v-mstep-num\">01<\u002Fdiv><h4>Listen Deeply<\u002Fh4><p>Structured discovery sessions with real users. Every pain point gets documented. No assumption goes unchallenged. We do not start with solutions. We start with truth.<\u002Fp><\u002Fdiv>\n    <div class=\"v-mstep\"><div class=\"v-mstep-num\">02<\u002Fdiv><h4>Make Them Heard<\u002Fh4><p>Follow-ups are not courtesy. They are commitment. Users know their input drove the decision. That trust is how ATS gets access to the real problems that everyone else misses.<\u002Fp><\u002Fdiv>\n    <div class=\"v-mstep\"><div class=\"v-mstep-num\">03<\u002Fdiv><h4>Prototype Fast<\u002Fh4><p>We lean toward a working version over a perfect spec. An imperfect live tool that surfaces real feedback is worth more than six months of requirements gathering.<\u002Fp><\u002Fdiv>\n    <div class=\"v-mstep\"><div class=\"v-mstep-num\">04<\u002Fdiv><h4>Iterate with Signal<\u002Fh4><p>Every deployment generates intelligence. We observe, refine, and redeploy in weeks, not quarterly cycles. The loop is the product.<\u002Fp><\u002Fdiv>\n    <div class=\"v-mstep\"><div class=\"v-mstep-num\">05<\u002Fdiv><h4>Stay at the Frontier<\u002Fh4><p>Every major AI release gets evaluated by ATS within days. We upskill constantly and translate what is new in AI into what is genuinely useful for WFG.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"v-stmt v-reveal\" style=\"border-left-color:#E8934A;\">\n    <p>The reason ATS solutions get adopted and stay adopted is because the people who use them felt heard before the first line was written. That is not a process detail. That is the whole strategy.<\u002Fp>\n    <div class=\"attr\" style=\"color:#4BBFE8;\">ATS Operating Principle<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- THREE HORIZONS -->\n<div class=\"v-section\">\n  <div class=\"v-label v-reveal\">Strategic Horizons<\u002Fdiv>\n  <h2 class=\"v-h v-reveal\">Where We <span class=\"acc\">Are.<\u002Fspan><br>Where We're <span class=\"gold\">Going.<\u002Fspan><\u002Fh2>\n  <p class=\"v-lead v-reveal\">ATS runs on three horizons at once. Shipping what is needed today, building what will matter tomorrow, and positioning WFG to set the standard for the industry.<\u002Fp>\n  <div class=\"v-horizon v-reveal\">\n    <div class=\"v-hor-card h1\">\n      <span class=\"v-hor-tag t1\">H1 · Now<\u002Fspan>\n      <h3>Deploy and Scale AI Initiatives<\u002Fh3>\n      <div class=\"year\">2025 – 2026<\u002Fdiv>\n      <ul class=\"v-hor-items\">\n        <li>eRemit and AATP fully operational<\u002Fli>\n        <li>FieldIQ SalesCRM approaching closed beta with WFG agencies<\u002Fli>\n        <li>FAR/BAR Deadline Calculator deployed<\u002Fli>\n        <li>Statement Mailer live for West Florida and Central Florida<\u002Fli>\n        <li>MyHomePrompts Advisor WFG launching at Executive Summit for agents &amp; realtors<\u002Fli>\n        <li>OKR Automation and Discovery Bot in production<\u002Fli>\n        <li>Fraud Detection tools active across channels<\u002Fli>\n        <li>ATS Intelligence Briefs expansively shared<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"v-hor-card h2\">\n      <span class=\"v-hor-tag t2\">H2 · Building<\u002Fspan>\n      <h3>Compound the Platform<\u002Fh3>\n      <div class=\"year\">2026 – 2027<\u002Fdiv>\n      <ul class=\"v-hor-items\">\n        <li>ALTA Chatbot Partnership moved from planning to live<\u002Fli>\n        <li>Agency and Direct AI layers connected<\u002Fli>\n        <li>Knowledge Bases scaled across all teams<\u002Fli>\n        <li>Internal AI upskilling program formalised<\u002Fli>\n        <li>Streamlined processes and more agent-facing solutions<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"v-hor-card h3\">\n      <span class=\"v-hor-tag t3\">H3 · Frontier<\u002Fspan>\n      <h3>Define the Industry<\u002Fh3>\n      <div class=\"year\">2027+<\u002Fdiv>\n      <ul class=\"v-hor-items\">\n        <li>WFG as the AI epicentre of the title industry<\u002Fli>\n        <li>Industry AI standards shaped by WFG solutions<\u002Fli>\n        <li>Predictive closing intelligence at scale<\u002Fli>\n        <li>ATS methodology replicated across the company<\u002Fli>\n        <li>WFG recognised as the most AI-forward title company<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MANIFESTO -->\n<div class=\"v-section\">\n  <div class=\"v-manifesto v-reveal\">\n    <div class=\"v-manifesto-label\">The ATS Manifesto<\u002Fdiv>\n    <h2>We Do Not Wait For<br><span class=\"acc\">The Industry<\u002Fspan> To <span class=\"gold\">Catch Up.<\u002Fspan><\u002Fh2>\n    <p>We read the research. We test the models. We talk to the people doing the actual work. And then we build the things that make their days meaningfully easier. That is not a mission statement. That is just the job, and we show up to it every day.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  const vReveals = document.querySelectorAll('.v-reveal');\n  const vObs = new IntersectionObserver((entries)=>{\n    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });\n  },{threshold:0.1});\n  vReveals.forEach(r=>vObs.observe(r));\n})();\n<\u002Fscript>\n\n<\u002Fdiv>\n\n<!-- PAGE 3 — ATS JOURNEY -->\n<div class=\"page\" id=\"evolution\">\n  <div class=\"section-tag\">Page 03 · The ATS Journey<\u002Fdiv>\n  <h2>From <span class=\"accent\">Consulting<\u002Fspan><br>to Platform.<\u002Fh2>\n  <p class=\"lead\">ATS began as an agency side innovation group. Over 18 months, it evolved into something far more significant — a company wide AI function with reach across every channel WFG operates.<\u002Fp>\n\n  <div class=\"diagram-wrap\">\n    <div style=\"font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:24px;\">ATS Evolution Timeline<\u002Fdiv>\n    <div class=\"phase-timeline\">\n      <div class=\"pt-step done\">\n        <div class=\"pt-dot\"><\u002Fdiv>\n        <div class=\"pt-card\">\n          <div class=\"pt-label\">Phase 1 · Jul–Sep 2025<\u002Fdiv>\n          <div class=\"pt-title\">Discovery<\u002Fdiv>\n          <div class=\"pt-body\">Workflow assessments across order entry, onboarding, closing, and remittance. Industry engagement at ALTA, Dreamforce, Chicago Underwriters. Mapping of WFG's hidden cost layers.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pt-step active\">\n        <div class=\"pt-dot\"><\u002Fdiv>\n        <div class=\"pt-card\">\n          <div class=\"pt-label\">Phase 2 · Oct–Dec 2025<\u002Fdiv>\n          <div class=\"pt-title\">Delivery<\u002Fdiv>\n          <div class=\"pt-body\">eRemit launched with Verndale. AATP Phase 1 deployed; Phase 2 in active development. OKR Automation live. Intelligence Briefs at 4 issues and scaling. MyHomePrompts Advisor WFG MVP scoped with Wendy Lunt — dev underway with Alltegrio. Title Search Statements Automation shipped for West Florida. Discovery Bot live on Slack.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pt-step future\">\n        <div class=\"pt-dot\"><\u002Fdiv>\n        <div class=\"pt-card\">\n          <div class=\"pt-label\">Phase 3 · 2026 &amp; Beyond<\u002Fdiv>\n          <div class=\"pt-title\">Platform<\u002Fdiv>\n          <div class=\"pt-body\">Full AI operating model spanning Agency, Direct, and Realtor channels. MyHomePrompts Advisor WFG launch at Executive Summit (June 2026), AATP Phase 2, FieldIQ closed beta, Reconciliations automation, Marketing Rate Calculator, Title Survey Processing, and the MuleSoft API framework — unified under one architecture.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px;\">\n      <div style=\"font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:12px;\">Key Milestones Shipped<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">eRemit ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">AATP Phase 1 ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">OKR Automation ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">Deadline Calculator ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">Intelligence Briefs ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">Discovery Bot ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.2);color:var(--teal);\">Statement Mailer ✓<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.06);border:1px solid rgba(75,191,232,.12);color:var(--gray);\">MyHomePrompts Advisor WFG →<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(75,191,232,.06);border:1px solid rgba(75,191,232,.12);color:var(--gray);\">FieldIQ →<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(232,147,74,.06);border:1px solid rgba(232,147,74,.15);color:var(--gold);\">Fraud Detection ⟳<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(232,147,74,.06);border:1px solid rgba(232,147,74,.15);color:var(--gold);\">MuleSoft API ⟳<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bridge\">\n    <h3>The Shift That Matters<\u002Fh3>\n    <p>ATS started by solving specific problems for specific agents. It now architects solutions that serve the entire WFG ecosystem — from the agency processing a remittance to the realtor building a practice to the sales manager tracking field activity. Solutions on solutions. Customer on customer. That is the operating model.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"page-num\">03<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 4 — AI OPERATING MODEL -->\n<div class=\"full-bleed-page\" id=\"model\">\n<div class=\"full-bleed-inner\">\n  <div class=\"section-tag\">Page 04 · The AI Operating Model<\u002Fdiv>\n  <h2>Four Layers.<br><span class=\"accent\">One System.<\u002Fspan><\u002Fh2>\n  <p class=\"lead\">ATS operates as a layered architecture, not a collection of tools. Each layer builds on the one below it, creating intelligence that compounds across the enterprise as it scales.<\u002Fp>\n\n  <div class=\"diagram-wrap\">\n    <div style=\"font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:20px;\">AI Operating Architecture — Hover each layer<\u002Fdiv>\n\n    <div>\n      <div class=\"al-layer l4\">\n        <div class=\"al-label-wrap\">\n          <div class=\"al-icon\">🖥️<\u002Fdiv>\n          <div>\n            <div class=\"al-layer-name\">Experience Layer<\u002Fdiv>\n            <div style=\"font-size:9px;color:var(--gray);margin-top:2px;\">Every stakeholder<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"al-content\">\n          <strong>Agency Portal · Direct Ops Dashboard · Realtor AI Interfaces · ATS Intelligence Briefs · MyHomePrompts Advisor WFG.<\u002Fstrong> Designed by Priyal Katudia and delivered across WFG's full distribution network. The same intelligence, expressed differently depending on who is using it.\n          <div class=\"al-chips\">\n            <span class=\"al-chip\">Agency Portal<\u002Fspan><span class=\"al-chip\">Direct Dashboard<\u002Fspan><span class=\"al-chip\">Realtor AI<\u002Fspan><span class=\"al-chip\">Intelligence Briefs<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-arrow\">↕<\u002Fdiv>\n      <div class=\"al-layer l3\">\n        <div class=\"al-label-wrap\">\n          <div class=\"al-icon\">⚙️<\u002Fdiv>\n          <div>\n            <div class=\"al-layer-name\">Workflow Layer<\u002Fdiv>\n            <div style=\"font-size:9px;color:var(--gray);margin-top:2px;\">Intelligence becomes velocity<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"al-content\">\n          <strong>eRemit automation · Deadline Calculator · Statement Mailer · OKR reporting · Onboarding acceleration · Reconciliations tracking · Rate Calculation.<\u002Fstrong> Reduces per-file cost, compresses cycle time, and frees people to do work that actually requires people.\n          <div class=\"al-chips\">\n            <span class=\"al-chip\">eRemit<\u002Fspan><span class=\"al-chip\">Deadline Calculator<\u002Fspan><span class=\"al-chip\">OKR Automation<\u002Fspan><span class=\"al-chip\">Statement Mailer<\u002Fspan><span class=\"al-chip\">Reconciliations<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-arrow\">↕<\u002Fdiv>\n      <div class=\"al-layer l2\">\n        <div class=\"al-label-wrap\">\n          <div class=\"al-icon\">🧠<\u002Fdiv>\n          <div>\n            <div class=\"al-layer-name\">AI Layer<\u002Fdiv>\n            <div style=\"font-size:9px;color:var(--gray);margin-top:2px;\">The intelligence<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"al-content\">\n          <strong>MyHomePrompts Advisor WFG · Deadline Calculator · Fraud risk scoring · Document classification · FieldIQ field intelligence · Title Survey processing.<\u002Fstrong> Designed by Anish Tatke and Vedant Upganlawar, built to run continuously — not episodically.\n          <div class=\"al-chips\">\n            <span class=\"al-chip\">MyHomePrompts Advisor WFG<\u002Fspan><span class=\"al-chip\">Fraud Detection<\u002Fspan><span class=\"al-chip\">FieldIQ<\u002Fspan><span class=\"al-chip\">Doc Classification<\u002Fspan><span class=\"al-chip\">Deadline Calculator<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-arrow\">↕<\u002Fdiv>\n      <div class=\"al-layer l1\">\n        <div class=\"al-label-wrap\">\n          <div class=\"al-icon\">🗄️<\u002Fdiv>\n          <div>\n            <div class=\"al-layer-name\">Data Layer<\u002Fdiv>\n            <div style=\"font-size:9px;color:var(--gray);margin-top:2px;\">The foundation<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"al-content\">\n          <strong>Transaction records · Agent performance data · Market signals · Fraud indicators · Remittance history.<\u002Fstrong> Unified through the MuleSoft API framework, Salesforce integrations, and AMS connectivity. Every AI decision traces back to this layer.\n          <div class=\"al-chips\">\n            <span class=\"al-chip\">MuleSoft API<\u002Fspan><span class=\"al-chip\">Salesforce<\u002Fspan><span class=\"al-chip\">AMS Connect<\u002Fspan><span class=\"al-chip\">Authorize.net<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px;padding:16px 20px;background:rgba(75,191,232,.05);border-radius:8px;border:1px solid rgba(75,191,232,.1);display:flex;align-items:center;gap:16px;\">\n      <div style=\"font-size:22px;opacity:.7;\">↻<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--gray);line-height:1.6;\"><strong style=\"color:var(--white);\">The compounding loop:<\u002Fstrong> Better data → sharper AI → faster workflows → richer experiences → more data. Once running, this loop is the moat.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bridge\">\n    <h3>Why the Layered Model Matters<\u002Fh3>\n    <p>Point solutions can be copied. A layered AI architecture cannot. Each layer reinforces the next. Better data produces better AI, better AI produces better workflows, and better workflows produce better experiences. That loop, once running, is the moat.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGES 5-6 — CAPABILITY PILLARS -->\n<div class=\"page\" id=\"pillars\">\n  <div class=\"section-tag\">Pages 05–06 · Core Capability Pillars<\u002Fdiv>\n  <h2>Five Pillars.<br><span class=\"accent\">Built to Compound.<\u002Fspan><\u002Fh2>\n  <p class=\"lead\">These are the capabilities that define WFG's AI advantage. Each one delivers standalone value. Together, they create something no competitor can replicate quickly.<\u002Fp>\n\n  <div class=\"pillar\">\n    <div class=\"pillar-header\"><div class=\"pillar-num\">01<\u002Fdiv><div class=\"pillar-title\">Conversational Intelligence<\u002Fdiv><\u002Fdiv>\n    <p>MyHomePrompts Advisor WFG is WFG's AI-powered brand voice and content platform for agents and realtors. Originally scoped as a prompt toolkit, it has been fully redesigned under Wendy Lunt's direction — with simplified single-voice architecture, role-based onboarding, and AI-driven content generation. The MVP is in active development with the Alltegrio team and is targeting launch at the WFG Executive Summit in June 2026.<\u002Fp>\n    <div class=\"pillar-badges\"><span class=\"badge\">MyHomePrompts Advisor WFG<\u002Fspan><span class=\"badge\">Brand Voice Engine<\u002Fspan><span class=\"badge\">Role-Based Onboarding<\u002Fspan><span class=\"badge\">Realtor Content Generation<\u002Fspan><span class=\"badge\">Executive Summit Launch<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pillar\">\n    <div class=\"pillar-header\"><div class=\"pillar-num\">02<\u002Fdiv><div class=\"pillar-title\">Transaction and Workflow Intelligence<\u002Fdiv><\u002Fdiv>\n    <p>Vedant Upganlawar's Deadline Calculator brings precision to one of the most error prone parts of any transaction — the contract timeline. It automates 16+ critical deadline computations, handles federal holidays, auto estimates missing inputs, and supports both cash and financed deals.<\u002Fp>\n    <div class=\"pillar-badges\"><span class=\"badge\">Deadline Calculator<\u002Fspan><span class=\"badge\">16+ Critical Date Computations<\u002Fspan><span class=\"badge\">Federal Holiday Handling<\u002Fspan><span class=\"badge\">Cash and Financed Deal Support<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pillar\">\n    <div class=\"pillar-header\"><div class=\"pillar-num\">03<\u002Fdiv><div class=\"pillar-title\">Document Automation and Financial Operations<\u002Fdiv><\u002Fdiv>\n    <p>ATS is rebuilding document processing as an AI-native function across WFG. eRemit, built with Verndale, enables agents to submit remittances directly from the platform with intelligent filtering and AMS integration. The Agent Application Tracking Portal (AATP) turns agent onboarding from a fragmented process into a structured, visible workflow — with Phase 2 in active development. The WFG Statement Mailer is now live for West Florida and expanding to Central Florida, automating bulk delivery of Title Search Fee Statements. Reconciliations automation is in planning, targeting the audit and management workflow.<\u002Fp>\n    <div class=\"pillar-badges\"><span class=\"badge\">eRemit<\u002Fspan><span class=\"badge\">AATP Phase 2<\u002Fspan><span class=\"badge\">Statement Mailer<\u002Fspan><span class=\"badge\">Reconciliations<\u002Fspan><span class=\"badge\">Document Classification AI<\u002Fspan><span class=\"badge\">MuleSoft API Layer<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pillar\">\n    <div class=\"pillar-header\"><div class=\"pillar-num\">04<\u002Fdiv><div class=\"pillar-title\">Institutional Knowledge Systems<\u002Fdiv><\u002Fdiv>\n    <p>ATS builds structured, AI-powered knowledge systems that convert institutional expertise into scalable infrastructure. The ATS Intelligence Briefs — four issues published, fraud-awareness focused, and video-embedded — are WFG's primary external AI education channel, reaching the full agent network. The Discovery Bot is ATS's always-on internal intelligence layer: running on Slack, it surfaces real operational pain points from the field and converts them into structured insight reports for the build team.<\u002Fp>\n    <div class=\"pillar-badges\"><span class=\"badge\">ATS Intelligence Briefs<\u002Fspan><span class=\"badge\">Discovery Bot<\u002Fspan><span class=\"badge\">AI Knowledge Bases<\u002Fspan><span class=\"badge\">OKR Automation<\u002Fspan><span class=\"badge\">Fraud Awareness Series<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pillar\">\n    <div class=\"pillar-header\"><div class=\"pillar-num\">05<\u002Fdiv><div class=\"pillar-title\">Agency to Direct to Realtor Unification<\u002Fdiv><\u002Fdiv>\n    <p>A unified intelligence layer ensures AI built for agency-side efficiency also serves WFG's Direct Operations across 8 states and 14 metro markets, and ultimately the realtors and buyers those operations serve. FieldIQ — ATS's AI-powered field sales intelligence platform — captures real-world relationship activity that title agents perform and converts it into structured data. Built on FastAPI, Next.js, and PostgreSQL, FieldIQ is approaching closed beta with 3–5 WFG-affiliated agencies. Ian Bartlett's field intelligence network feeds ground-level signal back into the build loop.<\u002Fp>\n    <div class=\"pillar-badges\"><span class=\"badge\">FieldIQ Field Intelligence<\u002Fspan><span class=\"badge\">AATP<\u002Fspan><span class=\"badge\">Direct Ops AI Initiatives<\u002Fspan><span class=\"badge\">MyHomePrompts Advisor WFG Realtor Engine<\u002Fspan><span class=\"badge\">Cross-Channel Deployment<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"page-num\">05<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 7 — ECOSYSTEM -->\n<div class=\"full-bleed-page\" id=\"ecosystem\">\n<div class=\"full-bleed-inner\">\n  <div class=\"section-tag\">Page 07 · Product Ecosystem<\u002Fdiv>\n  <h2>One <span class=\"accent\">Ecosystem.<\u002Fspan><br>Not Separate Tools.<\u002Fh2>\n  <p class=\"lead\">Every initiative ATS runs connects to the same underlying architecture. Products share data, intelligence compounds, and switching costs deepen with every additional tool in use.<\u002Fp>\n  <div style=\"display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:24px;background:rgba(75,191,232,.1);border:1px solid rgba(75,191,232,.3);margin-bottom:18px;animation:nudgePulse 2.6s ease-in-out infinite;\">\n    <span style=\"display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(75,191,232,.6);animation:dotPulse 1.8s ease-in-out infinite;\"><\u002Fspan>\n    <span style=\"font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.6px;text-transform:uppercase;\">Interactive — tap any product below to learn more<\u002Fspan>\n  <\u002Fdiv>\n  <style>\n    @keyframes nudgePulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}\n    @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(75,191,232,.6)}50%{box-shadow:0 0 0 6px rgba(75,191,232,0)}}\n    .hub-spoke-item rect{transition:fill .25s,stroke .25s,stroke-width .25s}\n    .hub-spoke-item:hover rect{fill:rgba(75,191,232,.1);stroke-width:1.5}\n  <\u002Fstyle>\n\n  <div class=\"diagram-wrap\" style=\"padding:20px;\">\n    <svg style=\"width:100%;display:block;\" viewBox=\"0 0 860 420\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n          <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <\u002Fmarker>\n      <\u002Fdefs>\n      <rect x=\"330\" y=\"160\" width=\"200\" height=\"100\" rx=\"12\" fill=\"rgba(75,191,232,0.12)\" stroke=\"rgba(75,191,232,0.4)\" stroke-width=\"1.5\"><\u002Frect>\n      <text x=\"430\" y=\"200\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#4BBFE8\">ATS Intelligence Core<\u002Ftext>\n      <text x=\"430\" y=\"218\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">Data · AI · Workflow · Experience<\u002Ftext>\n      <text x=\"430\" y=\"234\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\" font-size=\"9\" fill=\"rgba(75,191,232,0.7)\">MuleSoft · Salesforce · AMS<\u002Ftext>\n      <text x=\"430\" y=\"248\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\" font-size=\"9\" fill=\"rgba(75,191,232,0.7)\">Authorize.net · SSO<\u002Ftext>\n      <line x1=\"330\" y1=\"195\" x2=\"220\" y2=\"140\" stroke=\"rgba(75,191,232,0.3)\" stroke-width=\"1\" marker-end=\"url(#arr)\" ont-family=\"Inter,sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#FFFFFF\">Agent Portal<\u002Ftext>\n        <text x=\"52\" y=\"246\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">Onboarding &amp; lifecycle<\u002Ftext>\n        <text x=\"52\" y=\"261\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">real-time visibility<\u002Ftext>\n      <\u002Fg>\n      <g class=\"hub-spoke-item\" onclick=\"showSpoke(2)\" style=\"cursor:pointer;\">\n        <rect x=\"80\" y=\"315\" width=\"150\" height=\"70\" rx=\"8\" fill=\"rgba(255,255,255,0.04)\" stroke=\"rgba(75,191,232,0.25)\" stroke-width=\"0.8\"><\u002Frect>\n        <circle cx=\"98\" cy=\"345\" r=\"5\" fill=\"rgba(75,191,232,0.8)\"><\u002Fcircle>\n        <text x=\"112\" y=\"340\" font-family=\"Inter,sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#FFFFFF\">Intelligence Brief<\u002Ftext>\n        <text x=\"112\" y=\"356\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">AI education &amp; fraud awareness<\u002Ftext>\n        <text x=\"112\" y=\"371\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">4 issues, full agent network<\u002Ftext>\n      <\u002Fg>\n      <g class=\"hub-spoke-item\" onclick=\"showSpoke(3)\" style=\"cursor:pointer;\">\n        <rect x=\"650\" y=\"80\" width=\"175\" height=\"70\" rx=\"8\" fill=\"rgba(255,255,255,0.04)\" stroke=\"rgba(232,147,74,0.3)\" stroke-width=\"0.8\"><\u002Frect>\n        <circle cx=\"668\" cy=\"110\" r=\"5\" fill=\"rgba(232,147,74,0.8)\"><\u002Fcircle>\n        <text x=\"683\" y=\"105\" font-family=\"Inter,sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#FFFFFF\">MyHomePrompts Advisor WFG<\u002Ftext>\n        <text x=\"683\" y=\"121\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">Brand voice &amp; content platform<\u002Ftext>\n        <text x=\"683\" y=\"136\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">for agents and realtors<\u002Ftext>\n      <\u002Fg>\n      <g class=\"hub-spoke-item\" onclick=\"showSpoke(4)\" style=\"cursor:pointer;\">\n        <rect x=\"690\" y=\"215\" width=\"155\" height=\"70\" rx=\"8\" fill=\"rgba(255,255,255,0.04)\" stroke=\"rgba(232,147,74,0.3)\" stroke-width=\"0.8\"><\u002Frect>\n        <circle cx=\"708\" cy=\"245\" r=\"5\" fill=\"rgba(232,147,74,0.8)\"><\u002Fcircle>\n        <text x=\"722\" y=\"240\" font-family=\"Inter,sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#FFFFFF\">Deadline Calculator<\u002Ftext>\n        <text x=\"722\" y=\"256\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">16+ contract deadlines,<\u002Ftext>\n        <text x=\"722\" y=\"271\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">holiday-aware automation<\u002Ftext>\n      <\u002Fg>\n      <g class=\"hub-spoke-item\" onclick=\"showSpoke(5)\" style=\"cursor:pointer;\">\n        <rect x=\"640\" y=\"315\" width=\"170\" height=\"70\" rx=\"8\" fill=\"rgba(255,255,255,0.04)\" stroke=\"rgba(75,191,232,0.25)\" stroke-width=\"0.8\"><\u002Frect>\n        <circle cx=\"658\" cy=\"345\" r=\"5\" fill=\"rgba(75,191,232,0.8)\"><\u002Fcircle>\n        <text x=\"672\" y=\"340\" font-family=\"Inter,sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#FFFFFF\">Fraud Detection AI<\u002Ftext>\n        <text x=\"672\" y=\"356\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">Risk scoring &amp; wire fraud<\u002Ftext>\n        <text x=\"672\" y=\"371\" font-family=\"Inter,sans-serif\" font-size=\"10\" fill=\"#8B9BB4\">prevention, FinCEN-aligned<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>\n    <div class=\"eco-detail\" id=\"eco-detail\">\n      <div class=\"eco-detail-title\" id=\"eco-detail-title\">↑ Tap a product to see how it connects<\u002Fdiv>\n      <div class=\"eco-detail-body\" id=\"eco-detail-body\">Each product connects back to the ATS Intelligence Core — sharing data, surfacing signals, and reinforcing the overall system. The network effect compounds with every additional tool in use.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bridge\" style=\"margin-top:24px;\">\n    <h3>The Network Effect Principle<\u002Fh3>\n    <p>As more agents use WFG's AI tools, data quality improves, models sharpen, and switching costs deepen. eRemit data informs pricing intelligence. AATP workflow data improves onboarding design. FieldIQ field activity data sharpens realtor engagement strategy. Fraud Detection AI gets smarter with every transaction. Each capability feeds the next — and that loop is the long-term competitive advantage.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 8 — IMPACT -->\n<div class=\"page\" id=\"impact\">\n  <div class=\"section-tag\">Page 08 · Impact Across the Ecosystem<\u002Fdiv>\n  <h2>Every Channel.<br><span class=\"accent\">Measurable Results.<\u002Fspan><\u002Fh2>\n  <p class=\"lead\">ATS creates real, quantifiable impact at every level of WFG's operating model — from the agent processing a file to the executive reviewing weekly performance.<\u002Fp>\n\n  <div class=\"impact-grid\">\n    <div class=\"impact-item\">\n      <div class=\"audience\">Agency Network · 1,744 Agents<\u002Fdiv>\n      <h4>Agent Productivity<\u002Fh4>\n      <ul>\n        <li>eRemit removes remittance reconciliation friction across the full agency network<\u002Fli>\n        <li>Statement Mailer automates bulk delivery of Search Fee Statements — eliminating manual sends at scale<\u002Fli>\n        <li>Deadline Calculator eliminates manual timeline computation for every transaction<\u002Fli>\n        <li>AATP gives agents and sales reps full visibility into onboarding application status<\u002Fli>\n        <li>Intelligence Briefs keep agents current on AI tools and fraud threats<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"impact-item\">\n      <div class=\"audience\">Direct Operations · 8 States, 14 Markets<\u002Fdiv>\n      <h4>Operational Efficiency<\u002Fh4>\n      <ul>\n        <li>OKR Automation delivers standardised executive visibility on a weekly cadence<\u002Fli>\n        <li>Parallel workflow design compresses order cycle time<\u002Fli>\n        <li>Marketing Rate Calculator automates state-wise insurance rate computation for priority states<\u002Fli>\n        <li>MyHomePrompts Advisor WFG deploying to direct-side agents for Executive Summit launch<\u002Fli>\n        <li>Fraud Detection AI protecting direct ops from wire exposure across all markets<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"impact-item\">\n      <div class=\"audience\">Realtor Ecosystem<\u002Fdiv>\n      <h4>Realtor Engagement<\u002Fh4>\n      <ul>\n        <li>MyHomePrompts Advisor WFG gives realtors a persistent brand voice and automated content engine<\u002Fli>\n        <li>FieldIQ captures agent relationship activity and surfaces data that strengthens realtor partnerships<\u002Fli>\n        <li>Deadline Calculator reduces transaction confusion on the realtor side<\u002Fli>\n        <li>AI tools agents bring to realtor meetings are the reason realtors stay<\u002Fli>\n        <li>WFG differentiated not just by service, but by the technology it provides to partners<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"impact-item\">\n      <div class=\"audience\">Executive and Board Level<\u002Fdiv>\n      <h4>Strategic Leverage<\u002Fh4>\n      <ul>\n        <li>Per-file cost reduction pathway through document and workflow automation at scale<\u002Fli>\n        <li>OFPE efficiency trending toward 11.5 as the 2026 operating target<\u002Fli>\n        <li>AI as a competitive differentiator in agency recruitment, retention, and realtor preference<\u002Fli>\n        <li>Executive Summit (June 2026) as the ATS platform showcase to 300–500 attendees<\u002Fli>\n        <li>NPS of 94, world class and AI-enhanced<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"diff-split\" style=\"margin-top:32px;\">\n    <div style=\"grid-column:1/-1;display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;\">\n      <div style=\"font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);\">A Different Operating Model<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--gray);line-height:1.6;\">How most title companies approach AI vs. how WFG is building it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"diff-col not\">\n      <div class=\"diff-col-label not\">The Industry Default<\u002Fdiv>\n      <ul>\n        <li>AI as a point solution, vendor dependent<\u002Fli>\n        <li>Automation for one team, not the whole system<\u002Fli>\n        <li>Reactive fraud response<\u002Fli>\n        <li>Siloed digital transformation by department<\u002Fli>\n        <li>Technology as a cost center<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"diff-col active\">\n      <div class=\"diff-col-label is\">The WFG Model<\u002Fdiv>\n      <ul>\n        <li>AI as horizontal infrastructure across all channels<\u002Fli>\n        <li>Layered intelligence compounding across the system<\u002Fli>\n        <li>Proactive AI scored risk detection before closing<\u002Fli>\n        <li>Agency, Direct, and Realtor served by one AI layer<\u002Fli>\n        <li>Technology as a margin and growth driver<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"page-num\">08<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 9 — TEAM -->\n<div class=\"full-bleed-page\" id=\"team\">\n<div class=\"full-bleed-inner\">\n  <div class=\"section-tag\">Page 09 · The ATS Team<\u002Fdiv>\n  <h2>The People<br><span class=\"accent\">Behind the Platform.<\u002Fspan><\u002Fh2>\n  <p class=\"lead\">ATS is a small team with a large mandate. Each person owns a distinct layer of the operating model and together they cover the full stack from executive vision to field execution to AI engineering.<\u002Fp>\n\n  <div class=\"team-grid\">\n    <div class=\"team-card\">\n      <div class=\"avatar\">RO<\u002Fdiv>\n      <div class=\"team-info\">\n        <div class=\"team-name\">Ryan Ozonian<\u002Fdiv>\n        <div class=\"team-role\">Director, ATS<\u002Fdiv>\n        <div class=\"team-layer\">Vision and Strategy Layer<\u002Fdiv>\n        <p class=\"team-desc\">Ryan sets the direction for every ATS initiative. He bridges executive leadership with ground-level execution, owns the ATS mandate, and ensures every product built by the team connects back to WFG's core business objectives.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"team-card\">\n      <div class=\"avatar\">VU<\u002Fdiv>\n      <div class=\"team-info\">\n        <div class=\"team-name\">Vedant Upganlawar<\u002Fdiv>\n        <div class=\"team-role\">AI Solutions Engineer and Systems Analyst<\u002Fdiv>\n        <div class=\"team-layer\">Systems and Integrations Layer<\u002Fdiv>\n        <p class=\"team-desc\">Vedant owns system design, backend architecture, and platform integrations. He leads eRemit, AATP, Fraud Detection, Marketing Rate Calculations, MuleSoft API framework, and Title Survey processing — ensuring every AI layer connects to WFG's core operating systems.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"team-card\">\n      <div class=\"avatar gold-av\">PK<\u002Fdiv>\n      <div class=\"team-info\">\n        <div class=\"team-name\">Priyal Katudia<\u002Fdiv>\n        <div class=\"team-role\">AI Strategy and Business Innovation<\u002Fdiv>\n        <div class=\"team-layer\">Strategy and Experience Layer<\u002Fdiv>\n        <p class=\"team-desc\">Priyal drives ATS Intelligence Briefs, MyHomePrompts Advisor WFG development with Wendy Lunt, the Executive Summit ATS experience, and business documentation. She translates technical capability into strategic narrative and is the primary point of contact for external-facing programs.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"team-card\">\n      <div class=\"avatar\">AT<\u002Fdiv>\n      <div class=\"team-info\">\n        <div class=\"team-name\">Anish Tatke<\u002Fdiv>\n        <div class=\"team-role\">Senior AI Engineer<\u002Fdiv>\n        <div class=\"team-layer\">AI Engineering Layer<\u002Fdiv>\n        <p class=\"team-desc\">Anish designs, builds, and deploys WFG's production AI applications. He leads FieldIQ, the Discovery Bot, the WFG Statement Mailer, the ATS Playbook site, and the engineering backbone of the ATS platform — including automation systems and document intelligence pipelines.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bridge\" style=\"margin-top:32px;\">\n    <h3>How the Team Works<\u002Fh3>\n    <p>ATS operates on a continuous build loop. Ian surfaces what the field needs. Ryan sets the direction and owns the executive relationship. Priyal shapes the narrative, leads MyHomePrompts Advisor WFG with Wendy, drives Intelligence Briefs, and is leading the Executive Summit ATS experience. Vedant architects integrations — leading eRemit, AATP, Fraud Detection, and the MuleSoft framework. Anish engineers the products — FieldIQ, Discovery Bot, Statement Mailer, and the ATS Playbook site. Every initiative passes through the full team — which is why everything ATS delivers is production-ready and strategically grounded.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 10 — CONTACT + CLOSING (UPDATED) -->\n<div class=\"page\" id=\"contact\">\n  <div class=\"section-tag\">Page 10 · Contact and Closing<\u002Fdiv>\n  <h2>2026 and <span class=\"gold\">Beyond.<\u002Fspan><\u002Fh2>\n\n  <div class=\"forward\">\n    <div class=\"yr\">FORWARD LOOKING STATEMENT · 2026 AND BEYOND<\u002Fdiv>\n    <h2>WFG Will Be the AI Infrastructure of American Real Estate.<\u002Fh2>\n    <p>The ambition is not to lead in title technology. It is to become the company whose AI layer is so embedded in agent, realtor, and consumer workflows that choosing WFG is simply the intellig
